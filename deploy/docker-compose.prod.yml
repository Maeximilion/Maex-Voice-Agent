# Produktion: zusammen mit der Basis-Datei starten
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
services:
  db:
    ports: []                      # kein offener DB-Port nach außen
    restart: always

  api:
    ports: []                      # nur über Caddy erreichbar
    restart: always
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ENV: prod

  n8n:
    ports: []
    restart: always

  caddy:
    image: caddy:2-alpine
    restart: always
    environment:
      # Zugang zur Betriebsansicht. Ohne diese Werte startet Caddy zwar,
      # lässt aber niemanden auf /gui/* durch - das ist die sichere Seite.
      GUI_BASIC_AUTH_USER: ${GUI_BASIC_AUTH_USER}
      GUI_BASIC_AUTH_HASH: ${GUI_BASIC_AUTH_HASH}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, n8n]

volumes:
  caddy_data:
  caddy_config:
