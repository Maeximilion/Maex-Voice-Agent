; The media range of the AI telephone. deploy/docker-compose.prod.yml publishes
; exactly this range and api/tests/test_compose_ports.py holds both to it.
; Two ports per call leg (RTP and RTCP): 20 legs, a caller and a team leg for
; each concurrent call with room to spare (D16: up to 3).
[general]
rtpstart=10000
rtpend=10039
