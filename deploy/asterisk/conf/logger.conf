[general]

[logfiles]
; Container output only, no file; on the server its rotation and age limit
; are Docker's (docs/20 §12). `notice` stays: the dialplan's own lines (call
; id and kind of ending, no number) are notices, and the drills read them.
; A refused INVITE does not write the caller's number (#252 finding 12): the
; ACL of pjsip.conf refuses it before identification and logs the sender's
; address and port only. The line with the From URI (`log_failed_request`)
; comes after the ACL, for a request that passed it and matched no endpoint;
; the ACL and the endpoint's `match` take the same list, so none does. The
; drill "stranger" sends one from a number and checks the output for it.
console => notice,warning,error,verbose(3)
