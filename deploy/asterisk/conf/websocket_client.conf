; The media channel to the service `voice`: one connection per call. Asterisk
; sends user and password as Basic credentials; `voice` checks the password
; against VOICE_MEDIA_TOKEN. Rendered by deploy/asterisk/render.sh.

[voice]
type=websocket_client
connection_type=per_call_config
uri=ws://voice:8001/media
protocols=media
username=asterisk
password=${VOICE_MEDIA_TOKEN}
; `voice` down: one try of 2 s, then the dialplan rings the team.
connection_timeout=2000
reconnect_attempts=1
