; The media channel to the service `voice`: one connection per call. Asterisk
; sends user and password as Basic credentials; `voice` checks the password
; against VOICE_MEDIA_TOKEN. Rendered by deploy/asterisk/render.sh.

[voice]
type=websocket_client
connection_type=per_call_config
uri=ws://voice:8001/media
protocols=media
username=asterisk
password=${VOICE_MEDIA_TOKEN}
; `voice` down: one try of 2 s, then the dialplan rings the team. A `voice`
; that takes the connection and answers nothing: the handshake gives up after
; twice that (22.11.0 and later, the drill "voice frozen").
connection_timeout=2000
reconnect_attempts=1
; A `voice` that stops answering in the middle of a call: two pings of 2 s
; without a pong close the connection, and the dialplan rings the team (the
; drill "voice frozen mid-call"). Without them only the backstop of the
; dialplan, an hour, would end such a call.
enable_pingpongs=yes
pingpong_interval=2
pingpong_probes=2
