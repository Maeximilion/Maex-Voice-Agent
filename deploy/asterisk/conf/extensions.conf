; Dialplan of the AI telephone (docs/20 §2, §5). Every call goes to the service
; `voice` over the media channel; when our leg is gone the dialplan asks `voice`
; how it ended. Only "hangup" ends the call. "transfer <number>" dials that
; number if it is TEAM_PHONE or on TRANSFER_TARGETS, else TEAM_PHONE; anything
; else rings the team too: `voice` down, refusing the connection, crashed in
; the middle of a call, or not answering at all (CLAUDE.md §2 rule 5).
; Nobody at TEAM_PHONE either: a callback card, and a sentence for a caller
; the AI answered (`missed`, T-10.8).
;
; Values come from the environment of the container (deploy/asterisk/render.sh
; checks them): VOICE_NUMBER, the AI telephone's own number; TEAM_PHONE, where
; the team is when `voice` cannot say; TRANSFER_TARGETS, the other numbers a
; transfer may go to, comma-separated, may be empty, cleaned by render.sh (no
; blanks or empty fields, never TEAM_PHONE); VOICE_MEDIA_TOKEN, what `voice`
; wants to see; ACCESS_DIAL, where calls to the team go (render.sh, from
; ACCESS_HOST).
;
; Asterisk runs without verbose output (docker-compose.yml): it would print
; every step below with its values, the token included. What a call came to is
; logged with Log(), by the call's id and the kind of ending, without a number:
; neither the caller's nor the team's, which can be somebody's own mobile.

[general]
static=yes
writeprotect=yes

[from-access]
; Whatever number the access delivers the call on: a router sends the user of
; our registration, a trunk the dialled number.
exten => _[+0-9a-zA-Z]!,1,Goto(ai,s,1)

[ai]
; Loop guard (docs/20 §5): a call from our own number is a forwarding that came
; back. It is neither answered nor sent on. VOICE_NUMBER is E.164; an access
; may give the same number as 0049... or, a router in Germany, as 0... (the
; product is for Germany: "+49" is three characters).
exten => s,1,Set(OWN=${ENV(VOICE_NUMBER)})
 same => n,Set(OWN_INTL=00${OWN:1})
 same => n,Set(OWN_NATIONAL=0${OWN:3})
 same => n,GotoIf($["${CALLERID(num)}" = "${OWN}" | "${CALLERID(num)}" = "${OWN_INTL}" | "${CALLERID(num)}" = "${OWN_NATIONAL}"]?loop,1)
; The call's id and the caller's number go to `voice` as variables the media
; channel inherits ("__"); Asterisk reports them in MEDIA_START. Not as v()
; parameters of the URL: on Asterisk 22 they can reach another call's
; connection (issue #2194; a later call without v() carried an earlier one's on
; 22.11.0), and Asterisk logs the URL when `voice` is down (docs/20 §4).
 same => n,Set(__VOICE_CALL=${UNIQUEID})
 same => n,Set(__VOICE_CALLER=${CALLERID(num)})
; n: not answered until `voice` says its first sentence, so a call it hands to
; the team at once is never picked up by us. g: go on here when our leg ends.
; 10 s for `voice` to answer, then the team. S(3600): a backstop for a `voice`
; that holds the line and does nothing, an hour, above any call limit a tenant
; is likely to set (`service_config.max_call_seconds`, 420 by default).
 same => n,Dial(WebSocket/voice/nc(slin16)f(json),10,gS(3600))
; ANSWER: the AI answered and said who it is. NOANSWER: it handed the call on
; before a word (paused, shadow), or `voice` did not answer within the 10 s.
; Whether a caller is told anything after a team leg nobody answered (missed).
 same => n,Set(VOICE_LEG=${DIALSTATUS})
; `voice` was not reached at all (down, refusing, its name unknown): there is no
; ending to ask for, and asking would cost the caller another wait.
 same => n,GotoIf($["${DIALSTATUS}" = "CHANUNAVAIL"]?unreached,1)
 same => n,Set(CURLOPT(userpwd)=asterisk:${ENV(VOICE_MEDIA_TOKEN)})
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=2)
 same => n,Set(ENDING=${CURL(http://voice:8001/calls/${UNIQUEID}/ending)})
 same => n,Log(NOTICE,call ${UNIQUEID}: voice leg ${DIALSTATUS} ending [${ENDING:0:8}])
 same => n,GotoIf($["${ENDING}" = "hangup"]?done,1)
; A transfer goes to its number only if that is TEAM_PHONE or on
; TRANSFER_TARGETS, exactly as written there (render.sh: numbers, none our own).
; Any other number `voice` names, from a database row somebody changed or a
; `voice` that is no longer ours, is never dialled: the team at TEAM_PHONE
; instead (#252 finding 3). Everything else goes to the team as well.
 same => n,Set(TARGET=${FILTER(+0123456789,${ENDING:9})})
 same => n,Set(LISTED=${ENV(TEAM_PHONE)},${ENV(TRANSFER_TARGETS)})
 same => n,GotoIf($["${ENDING:0:9}" != "transfer "]?toteam)
 same => n,GotoIf($["${TARGET}" != "" & ${FIELDNUM(LISTED,\,,${TARGET})} > 0]?team,1)
 same => n,Log(NOTICE,call ${UNIQUEID}: transfer to a number not on the list)
 same => n(toteam),Set(TARGET=${ENV(TEAM_PHONE)})
 same => n,Goto(team,1)

; The explicit URI: `PJSIP/<number>@access` does not take a number with "+".
; ACCESS_DIAL is ACCESS_HOST with port 5060, which spares the NAPTR and SRV
; lookups of a host without such records (on the workbench they cost 2 to 7 s
; before the team rang, with the port 0.1 s, docs/20 §11), or the name alone
; when it has SIP SRV records, so the leg goes where they say (render.sh). A
; trunk with TLS changes this line (docs/20 §3).
; A leg at another number of the list that nobody took (busy, refused, not
; reachable as far as the network says so, or 30 s without an answer) is
; followed by one at TEAM_PHONE (#252 finding 1). r: the caller hears ringing
; and never the network's early media, so an announcement that the number
; cannot be reached does not make the caller hang up before TEAM_PHONE. A
; mailbox that answers is an answer: the call stays there (docs/20 §5). A caller
; who hangs up ends the dialplan, so nobody is rung for a call that is gone.
; Without `g` an answered leg never comes back here, so only an unanswered one
; can reach the second leg.
; Nobody at TEAM_PHONE either: a callback card and a sentence (missed).
exten => team,1,Log(NOTICE,call ${UNIQUEID}: to the team)
 same => n,Dial(PJSIP/access/sip:${TARGET}@${ENV(ACCESS_DIAL)},30,r)
 same => n,Log(NOTICE,call ${UNIQUEID}: team leg ${DIALSTATUS})
 same => n,GotoIf($["${TARGET}" = "${ENV(TEAM_PHONE)}"]?missed,1)
 same => n,Set(TARGET=${ENV(TEAM_PHONE)})
 same => n,Goto(team,1)

; Nobody answered at TEAM_PHONE (T-10.8, docs/20 §5). `voice` writes a callback
; card, the team's only notice of the call then, and says "noted" once it is
; written. Asked also when its leg found it unreachable (CHANUNAVAIL): a leg it
; took and lost before its first sentence ends the same way, and its row is
; there; a `voice` that is down answers nothing, and nothing is played then
; anyway. The credentials are set here for that path too; 4 s: the card's write
; waits up to 2 s on the call's row, which the log of our leg may hold. A later
; answer counts as none: the caller hears to call again, and the card may still
; come. A caller the AI answered hears one of the sentences `voice` rendered
; into /announcements at its start: that the restaurant calls back after
; "noted", to call again after anything else, `voice` or the database down
; included. Whoever answered, the AI said who it is first (the greeting, or
; the outage sentence before it). Nothing is played to a caller the AI never
; answered (paused, shadow, `voice` not reached): the call ends as an
; unanswered one does. Playback of a missing file would answer the call first
; and fail then (22.11.0): STAT before it. A caller who hangs up while the team
; rings ends the dialplan: no card.
exten => missed,1,Set(CURLOPT(userpwd)=asterisk:${ENV(VOICE_MEDIA_TOKEN)})
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=4)
 same => n,Set(CARD=${CURL(http://voice:8001/calls/${UNIQUEID}/missed,missed)})
 same => n,Set(SAY=${IF($["${CARD}" = "noted"]?missed_noted:missed_later)})
 same => n,Log(NOTICE,call ${UNIQUEID}: nobody at the team, card [${CARD:0:5}])
 same => n,GotoIf($["${VOICE_LEG}" != "ANSWER"]?end)
 same => n,GotoIf(${STAT(e,/announcements/${SAY}.sln16)}?:end)
 same => n,Playback(/announcements/${SAY})
 same => n,Log(NOTICE,call ${UNIQUEID}: told the caller ${SAY} ${PLAYBACKSTATUS})
 same => n(end),Hangup()

exten => unreached,1,Log(NOTICE,call ${UNIQUEID}: voice not reached)
 same => n,Set(TARGET=${ENV(TEAM_PHONE)})
 same => n,Goto(team,1)

exten => done,1,Log(NOTICE,call ${UNIQUEID}: ended by the AI telephone)
 same => n,Hangup()

exten => loop,1,Log(NOTICE,call ${UNIQUEID}: from our own number and refused)
 same => n,Hangup(21)
