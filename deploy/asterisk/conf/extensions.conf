; Dialplan of the AI telephone (docs/20 §2, §5). Every call goes to the service
; `voice` over the media channel; when our leg is gone the dialplan asks `voice`
; how it ended. Only "hangup" ends the call. "transfer <number>" dials that
; number, and anything else rings the team: `voice` down, refusing the
; connection, crashed in the middle of a call, or not answering at all
; (CLAUDE.md §2 rule 5).
;
; Values come from the environment of the container (deploy/asterisk/render.sh
; checks that they are set): VOICE_NUMBER, the AI telephone's own number;
; TEAM_PHONE, where the team is when `voice` cannot say; VOICE_MEDIA_TOKEN, what
; `voice` wants to see; ACCESS_HOST, where calls to the team go.
;
; Asterisk runs without verbose output (docker-compose.yml): it would print
; every step below with its values, the token included. What a call came to is
; logged with Log(), by the call's id and without the caller's number.

[general]
static=yes
writeprotect=yes

[from-access]
; Whatever number the access delivers the call on: a router sends the user of
; our registration, a trunk the dialled number.
exten => _[+0-9a-zA-Z]!,1,Goto(ai,s,1)

[ai]
; Loop guard (docs/20 §5): a call from our own number is a forwarding that came
; back. It is neither answered nor sent on.
exten => s,1,GotoIf($["${CALLERID(num)}" = "${ENV(VOICE_NUMBER)}"]?loop,1)
; n: not answered until `voice` says its first sentence, so a call it hands to
; the team at once is never picked up by us. g: go on here when our leg ends.
; 10 s for `voice` to answer, then the team. S(900): a backstop far above any
; tenant's call limit, for a `voice` that holds the line and does nothing.
 same => n,Dial(WebSocket/voice/nc(slin16)f(json)v(call=${UNIQUEID},caller=${URIENCODE(${CALLERID(num)})}),10,gS(900))
; `voice` was not reached at all (down, refusing, its name unknown): there is no
; ending to ask for, and asking would cost the caller another wait.
 same => n,GotoIf($["${DIALSTATUS}" = "CHANUNAVAIL"]?unreached,1)
 same => n,Set(CURLOPT(userpwd)=asterisk:${ENV(VOICE_MEDIA_TOKEN)})
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=2)
 same => n,Set(ENDING=${CURL(http://voice:8001/calls/${UNIQUEID}/ending)})
 same => n,Log(NOTICE,call ${UNIQUEID}: voice leg ${DIALSTATUS} ending [${ENDING}])
 same => n,GotoIf($["${ENDING}" = "hangup"]?done,1)
; A transfer goes to its number if that is a number and not our own; everything
; else to the team.
 same => n,Set(TARGET=${FILTER(+0123456789,${ENDING:9})})
 same => n,GotoIf($["${ENDING:0:9}" = "transfer " & "${TARGET}" != "" & "${TARGET}" != "${ENV(VOICE_NUMBER)}"]?team,1)
 same => n,Set(TARGET=${ENV(TEAM_PHONE)})
 same => n,Goto(team,1)

; The explicit URI: `PJSIP/<number>@access` does not take a number with "+".
; The port spares the NAPTR and SRV lookups of the host: on the workbench they
; cost 2 to 7 s before the team rang, with it 0.1 s (docs/20 §11). A trunk with
; TLS changes this line (docs/20 §3).
; Who does not pick up within 30 s becomes a callback card (T-10.8).
exten => team,1,Log(NOTICE,call ${UNIQUEID}: to the team at ${TARGET})
 same => n,Dial(PJSIP/access/sip:${TARGET}@${ENV(ACCESS_HOST)}:5060,30)
 same => n,Log(NOTICE,call ${UNIQUEID}: team leg ${DIALSTATUS})
 same => n,Hangup()

exten => unreached,1,Log(NOTICE,call ${UNIQUEID}: voice not reached)
 same => n,Set(TARGET=${ENV(TEAM_PHONE)})
 same => n,Goto(team,1)

exten => done,1,Log(NOTICE,call ${UNIQUEID}: ended by the AI telephone)
 same => n,Hangup()

exten => loop,1,Log(NOTICE,call ${UNIQUEID}: from our own number and refused)
 same => n,Hangup(21)
