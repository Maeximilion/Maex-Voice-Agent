; The access of the AI telephone (docs/20 §3): Asterisk registers at a router
; that acts as a telephone system (test phase) or at a SIP trunk (operation),
; takes the calls it delivers and dials the team through it. Host, user and
; password come from .env (ACCESS_HOST, ACCESS_USER, ACCESS_PASSWORD), rendered
; by deploy/asterisk/render.sh; nothing of the access is in the repository.
;
; Not here yet: TLS and the public media address for a trunk on the server
; (decided with the trunk), and what the pilot's router needs (T-10.1 step 2).

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[access]
type=registration
transport=transport-udp
outbound_auth=access
server_uri=sip:${ACCESS_HOST}
client_uri=sip:${ACCESS_USER}@${ACCESS_HOST}
contact_user=${ACCESS_USER}
retry_interval=20
forbidden_retry_interval=60
expiration=120

[access]
type=auth
auth_type=userpass
username=${ACCESS_USER}
password=${ACCESS_PASSWORD}

[access]
type=aor
contact=sip:${ACCESS_HOST}
qualify_frequency=30

[access]
type=endpoint
transport=transport-udp
context=from-access
disallow=all
allow=alaw,ulaw
outbound_auth=access
aors=access
from_user=${ACCESS_USER}
direct_media=no
dtmf_mode=rfc4733

[access]
type=identify
endpoint=access
match=${ACCESS_HOST}
