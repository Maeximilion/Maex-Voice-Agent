# Outage drills of the AI telephone on the workbench (T-1.11, docs/20 §5 and
# §10). Started and judged by scripts/voice_drill.py, which renders the router's
# configuration into DRILL_RUN and names the project after that folder. Own
# network, no host port, invented numbers, a throwaway database.
#
# `asterisk` is the service of the product, taken from docker-compose.yml as it
# is: its configuration (deploy/asterisk/conf/) is what the drills exercise.
# `voice` is the product's process with the drill engines (an ear that hears
# nothing, a mouth of noise) and a model address that does not exist, so a turn
# of the core fails the way a model outage does.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: maex
      POSTGRES_PASSWORD: maex
      POSTGRES_DB: maex
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maex -d maex"]
      interval: 2s
      timeout: 3s
      retries: 15

  setup:
    build: ../../api
    user: "${DRILL_UID}:${DRILL_GID}"
    environment: &app
      HOME: /tmp
      ENV: dev
      DATABASE_URL: postgresql+psycopg://maex:maex@db:5432/maex
      TENANT_NAME: Drillbetrieb
      TEAM_PHONE: ${TEAM_PHONE}
    command:
      - sh
      - -c
      - alembic -c db/alembic.ini upgrade head && python -m scripts.seed
    volumes:
      - ../../api:/app/api:ro
      - ../../db:/app/db:ro
      - ../../scripts:/app/scripts:ro
    depends_on:
      db:
        condition: service_healthy

  voice:
    build: ../../api
    user: "${DRILL_UID}:${DRILL_GID}"
    environment:
      <<: *app
      VOICE_NUMBER: ${VOICE_NUMBER}
      VOICE_MEDIA_TOKEN: ${VOICE_MEDIA_TOKEN}
      VOICE_EAR: fake
      VOICE_MOUTH: fake
      VOICE_SILENCE_SECONDS: "2"
      LLM_BASE_URL: http://model.invalid
      LLM_MODEL: drill
      LLM_TIMEOUT_SECONDS: "2"
    command:
      - uvicorn
      - --factory
      - api.telephony.app:from_settings
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    volumes:
      - ../../api:/app/api:ro
      - ../../prompts:/app/prompts:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 2s
      timeout: 3s
      retries: 15
    depends_on:
      setup:
        condition: service_completed_successfully

  router:
    # The stand-in for the router or the trunk: the registrar the AI telephone
    # registers at, the caller who rings it, and the team telephone.
    image: andrius/asterisk:22.10.1_alpine-3.24-6bb254a@sha256:e598f443c1db2fcb5a7c5d5a2a2c2269d00ac92e24f97521ba3801fb8df84f39
    environment:
      PUID: ${DRILL_UID}
      PGID: ${DRILL_GID}
      ASTERISK_TERMINAL_OPTS: "-n"
    volumes:
      - ${DRILL_RUN}/router:/etc/asterisk
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core waitfullybooted"]
      interval: 2s
      timeout: 5s
      retries: 30

  asterisk:
    extends:
      file: ../../docker-compose.yml
      service: asterisk
    restart: "no"
    depends_on:
      router:
        condition: service_healthy
      voice:
        condition: service_healthy
