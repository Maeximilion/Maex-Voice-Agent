; Scripted softphone of the spike T-10.1: a second Asterisk that only places
; calls to the test PBX. @SOFTPHONE_PASSWORD@ is filled in by
; scripts/voice_spike.py.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[pbx]
type=endpoint
context=nowhere
disallow=all
allow=alaw
outbound_auth=pbx
aors=pbx
direct_media=no
dtmf_mode=rfc4733

[pbx]
type=auth
auth_type=userpass
username=softphone
password=@SOFTPHONE_PASSWORD@

[pbx]
type=aor
contact=sip:pbx:5060
