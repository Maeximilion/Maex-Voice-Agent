; The caller's side of each test call. scripts/voice_spike.py starts one with
;   channel originate Local/<exten>@dialout extension <exten>@script
; What the other side does per extension: PLANS in api/telephony/probe.py.
; Every call records what it hears (<exten>-heard.wav) and what it sends.

[dialout]
; An invented caller number per extension, so calls are told apart.
exten => _6XX,1,Set(CALLERID(num)=+4972215550${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@pbx,20)
 same => n,Hangup()

[script]
; 601 to 603: play our tone, press the last digit of the extension, hang up.
exten => _60X,1,MixMonitor(${EXTEN}.wav,r(${EXTEN}-heard.wav)t(${EXTEN}-sent.wav))
 same => n,Playback(/tones/caller-${EXTEN})
 same => n,SendDTMF(${EXTEN:2})
 same => n,Wait(2)
 same => n,Hangup()

; 610: listen for two seconds, then press the key that stops the playback.
exten => 610,1,MixMonitor(${EXTEN}.wav,r(${EXTEN}-heard.wav)t(${EXTEN}-sent.wav))
 same => n,Wait(2)
 same => n,SendDTMF(5)
 same => n,Wait(3)
 same => n,Hangup()

; 611: only listen. The other side hangs up.
exten => 611,1,MixMonitor(${EXTEN}.wav,r(${EXTEN}-heard.wav)t(${EXTEN}-sent.wav))
 same => n,Wait(20)
 same => n,Hangup()
