; Test PBX of the spike T-10.1 (docs/20 §10). The only telephone is the scripted
; softphone of the same Compose project; nothing here is reachable from outside.
; @SOFTPHONE_PASSWORD@ is filled in by scripts/voice_spike.py, new on every run.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[softphone]
type=endpoint
context=from-softphone
disallow=all
allow=alaw
auth=softphone
identify_by=auth_username
direct_media=no
dtmf_mode=rfc4733

[softphone]
type=auth
auth_type=userpass
username=softphone
password=@SOFTPHONE_PASSWORD@
