; Every test extension goes to the voice service over the media channel:
; 16 kHz signed linear, JSON control frames (Asterisk 22.8 or later). The dialed
; extension and the caller number travel as URI parameters.

[from-softphone]
exten => _6XX,1,NoOp(test call to ${EXTEN} from ${CALLERID(num)})
 same => n,Dial(WebSocket/voice/c(slin16)f(json)v(exten=${EXTEN},caller=${URIENCODE(${CALLERID(num)})}))
 same => n,Hangup()
