; The drill's router (deploy/asterisk/docker-compose.drill.yml): the AI telephone
; registers here as user `ai`, the way it will at the pilot's router. Every call
; it places through us is the team leg. @ACCESS_PASSWORD@ is filled in by
; scripts/voice_drill.py, new on every run.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[ai]
type=endpoint
context=from-ai
disallow=all
allow=alaw
auth=ai
aors=ai
direct_media=no
dtmf_mode=rfc4733

[ai]
type=auth
auth_type=userpass
username=ai
password=@ACCESS_PASSWORD@

[ai]
type=aor
max_contacts=1
remove_existing=yes
