; The drill's router. scripts/voice_drill.py places each call with
;   channel originate Local/<n>@dialout extension <n>@caller
; and reads the DRILL lines of the log. The caller's number is +4972215550<n>;
; n = 100 is the AI telephone's own number (VOICE_NUMBER of the drill).

[dialout]
exten => _1XX,1,Set(CALLERID(num)=+4972215550${EXTEN})
 same => n,NoOp(DRILL ${EXTEN} dials the AI telephone)
 same => n,Dial(PJSIP/ai,30,g)
 same => n,NoOp(DRILL ${EXTEN} caller leg ended dialstatus=${DIALSTATUS})
 same => n,Hangup()

; 200: the AI telephone's own number in the national form, the way a router in
; Germany sends it.
exten => 200,1,Set(CALLERID(num)=072215550100)
 same => n,NoOp(DRILL ${EXTEN} dials the AI telephone)
 same => n,Dial(PJSIP/ai,30,g)
 same => n,NoOp(DRILL ${EXTEN} caller leg ended dialstatus=${DIALSTATUS})
 same => n,Hangup()

[caller]
; Once someone answered the caller: the AI telephone or the team. 102, 111, 113
; and 117 press keys, the others stay silent until the other side hangs up. 111
; and 113 wait out a team leg nobody answers and the sentence after it. 123 to
; 125 speak: a tone, which is "Ja" to the drill's ear, every second of it. Half
; a second in, well inside the 2 s of silence after the question: at 1 s, one
; call in a dozen lost that race on the workbench. 127 hangs up as early, on
; the question, before the team rang. 128 speaks into a line whose RTP the
; drill blocks at the AI telephone (#651).
exten => _[12]XX,1,NoOp(DRILL ${EXTEN} answered)
 same => n,GotoIf($["${EXTEN}" = "102" | "${EXTEN}" = "111" | "${EXTEN}" = "113" | "${EXTEN}" = "117"]?keys)
 same => n,GotoIf($["${EXTEN}" = "123" | "${EXTEN}" = "124" | "${EXTEN}" = "125" | "${EXTEN}" = "128"]?speaks)
 same => n,GotoIf($["${EXTEN}" = "127"]?leaves)
 same => n,Wait(60)
 same => n,Hangup()
 same => n(leaves),Wait(0.5)
 same => n,Hangup()
 same => n(keys),Wait(3)
 same => n,SendDTMF(12#)
 same => n,Wait(90)
 same => n,Hangup()
 same => n(speaks),Wait(0.5)
 same => n,Playtones(440)
 same => n,Wait(60)
 same => n,Hangup()

[from-ai]
; The team telephone: what the AI telephone dials goes here. It answers, unless
; a drill of a team leg nobody answers (T-10.8) set the global TEAM_AWAY: busy
; at once, or ringing for longer than the AI telephone waits (30 s). "stop"
; answers and presses the key that stops a recording (T-11.3).
exten => _+X.,1,NoOp(DRILL team rings at ${EXTEN} for ${CALLERID(num)})
 same => n,GotoIf($["${TEAM_AWAY}" = "busy"]?busy)
 same => n,GotoIf($["${TEAM_AWAY}" = "ring"]?ring)
 same => n,GotoIf($["${TEAM_AWAY}" = "stop"]?stop)
 same => n,Answer()
 same => n,Wait(2)
 same => n,Hangup()
 same => n(stop),Answer()
 same => n,Wait(1)
 same => n,SendDTMF(*7)
 same => n,Wait(2)
 same => n,Hangup()
 same => n(busy),Hangup(17)
 same => n(ring),Ringing()
 same => n,Wait(45)
 same => n,Hangup()

; 901: a number on the AI telephone's list of transfer targets whose telephone
; is busy (486), the way a team member's mobile in a call is.
exten => +4972215550901,1,NoOp(DRILL team rings at ${EXTEN} for ${CALLERID(num)})
 same => n,Hangup(17)

; 999: a number on no list. Dialled at all is the failure the drill looks for;
; refused here, so a dialplan that dials it still goes on to TEAM_PHONE and
; the drill reports a failed point instead of stopping the run.
exten => +4972215550999,1,NoOp(DRILL team rings at ${EXTEN} for ${CALLERID(num)})
 same => n,Hangup(21)
