# The one Caddy in front of every customer's stack (D32, docs/23 §7 and §8).
# Started and reloaded by scripts/new_stack.py, never by hand:
#   docker compose -p maex-caddy -f deploy/caddy/docker-compose.yml \
#     -f <root>/caddy/networks.json up -d
# networks.json (written by the script) puts it on each stack's `edge` network;
# each stack's site file in <root>/caddy/sites names that stack's containers.
name: maex-caddy

services:
  caddy:
    # The same pin as deploy/docker-compose.prod.yml (api/tests/test_new_stack.py).
    image: caddy:2.11.9-alpine
    restart: always
    logging:
      driver: journald
    # Certificates; the stacks' networks are internal and come from networks.json.
    networks: [public]
    # Root in the image; a user of its own here (#888 S10), the same as in
    # deploy/docker-compose.prod.yml, which owns the certificates through
    # caddy-chown below. As that user it needs NET_BIND_SERVICE for 80 and 443
    # wherever Docker leaves the unprivileged ports above 1024.
    user: "10002:10002"
    depends_on:
      caddy-chown:
        condition: service_completed_successfully
    # The site files are mode 640 and owned by the deploy user: Caddy reads
    # them through this group alone.
    group_add: ["${MAEX_SITES_GID:?set by scripts/new_stack.py}"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: [/tmp]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${MAEX_SITES:?set by scripts/new_stack.py}:/etc/caddy/sites:ro
      # The operator dashboard's site, empty until `new_stack.py --ops-site`.
      - ${MAEX_OPERATOR_SITE:?set by scripts/new_stack.py}:/etc/caddy/operator:ro
      - caddy_data:/data
      - caddy_config:/config

  # Gives Caddy's volumes to its user before it starts: certificates and keys
  # that a Caddy before #888 S10 wrote as root (0600) are unreadable to it
  # otherwise, and it would ask for new ones on every start. A no-op once the
  # owner is right.
  caddy-chown:
    image: caddy:2.11.9-alpine
    logging:
      driver: journald
    entrypoint: ["chown", "-Rh", "10002:10002", "/data", "/config"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: "no"
    network_mode: none
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # CHOWN for the owner, DAC_READ_SEARCH to pass through directories that
    # are 0700 and already its user's on every later run. -h changes a link,
    # never what it points to.
    cap_add: [CHOWN, DAC_READ_SEARCH]
    read_only: true

networks:
  # IPv6 of its own: otherwise Docker's proxy takes every IPv6 client's
  # connection and Caddy sees them all from one address, so the per-address
  # limits of both logins become one bucket (#888 D1, docs/13 §8).
  public:
    enable_ipv6: true

volumes:
  caddy_data:
  caddy_config:
