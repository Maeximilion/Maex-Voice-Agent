# Age limit of the server's journal, which holds every container's output in
# production (deploy/docker-compose.prod.yml) next to the host's own (T-11.7,
# docs/03 "Löschkonzept": container and proxy logs at most 14 days).
#
# Install on the server as root, once (docs/13 §3):
#   install -D -m 644 deploy/journald.conf /etc/systemd/journald.conf.d/maex-retention.conf
#   systemctl restart systemd-journald
#
# journald deletes a journal file as a whole when its first entry is older than
# MaxRetentionSec, at the next rotation; MaxFileSec rotates the file in use at
# least once a day. So no entry is kept longer than the sum of the two: 14 days.
[Journal]
MaxRetentionSec=13day
MaxFileSec=1day
