; The load test's router (#841): every customer stack's AI telephone registers
; here as user ai<s>, the way it will at its restaurant's router. The kit
; appends one endpoint, auth and aor per stack, with the password of that
; stack's .env (ACCESS_PASSWORD), rendered into the run directory only.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
