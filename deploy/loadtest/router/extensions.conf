; The load test's router (#841, api/telephony/load.py): the line of every
; customer stack on the test server, the callers on it and the team telephones.
; The kit places each call with
;   channel originate Local/<s><nn>@dialout extension <s><nn>@caller
; for stack s (1 to 9) and call nn, and reads the LOAD lines of the log. The
; globals are filled in by the kit; STEP names the folder of a step's recordings.
[globals]
TURNS=@TURNS@
SPEAK=@SPEAK@
LISTEN=@LISTEN@
GREETING=@GREETING@
STEP=none

[dialout]
exten => _XXX,1,Set(CALLERID(num)=+497221556${EXTEN})
 same => n,NoOp(LOAD ${EXTEN} dials stack ${EXTEN:0:1})
 same => n,Dial(PJSIP/ai${EXTEN:0:1},30,g)
 same => n,NoOp(LOAD ${EXTEN} caller leg ended dialstatus=${DIALSTATUS})
 same => n,Hangup()

[caller]
; Once the AI telephone answered: record both directions apart, wait out the
; greeting, then speak TURNS times, a 440 Hz tone of SPEAK seconds each (the
; load ear's speech), and listen LISTEN seconds for the answer behind it. In
; between the caller sends silence, as a telephone line does: without frames
; the AI telephone would never hear the silence that ends a turn, and the
; recordings would leave the quiet stretches out.
exten => _XXX,1,NoOp(LOAD ${EXTEN} answered)
 same => n,MixMonitor(/recordings/${STEP}/${EXTEN}.wav,r(/recordings/${STEP}/${EXTEN}-heard.wav)t(/recordings/${STEP}/${EXTEN}-said.wav))
 same => n,Playtones(0)
 same => n,Wait(${GREETING})
 same => n,Set(TURN=0)
 same => n(turn),Playtones(440)
 same => n,Wait(${SPEAK})
 same => n,Playtones(0)
 same => n,Wait(${LISTEN})
 same => n,Set(TURN=$[${TURN} + 1])
 same => n,GotoIf($[${TURN} < ${TURNS}]?turn)
 same => n,NoOp(LOAD ${EXTEN} caller hangs up)
 same => n,Hangup()

[from-ai]
; A team telephone: whatever an AI telephone dials. A ring under load is a
; turn the AI did not manage, and the kit counts it.
exten => _+X.,1,NoOp(LOAD team rings at ${EXTEN} for ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(2)
 same => n,Hangup()
