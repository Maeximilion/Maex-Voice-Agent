<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Raumplan - interaktiver Entwurf</title>
<style>
body { margin: 0; padding: 16px; font-family: system-ui, sans-serif; }
main { max-width: 1040px; margin: 0 auto; }
.cursor-interaction { cursor: pointer; }
@media(max-width:580px) { body { padding:8px; } }
</style>
<script>
(() => {
  const key = 'maex-approved-floor-plan-v3';
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(key)); } catch (_) {}
  window.floorPlanPreview = {
    widgetState: saved,
    async setWidgetState(value) {
      this.widgetState = value;
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {}
    }
  };
})();
</script>
</head>
<body><main>
<style>
#maex-room-editor {
 --re-bg:light-dark(#f6f8f5,#1d2520); --re-panel:light-dark(#ffffff,#27312a); --re-ink:light-dark(#243c2e,#e5eee7);
 --re-sub:light-dark(#65776a,#afc2b3); --re-line:light-dark(#dce4dc,#47584b); --re-green:light-dark(#35694b,#a1cfac);
 --re-on:light-dark(#ffffff,#173520); --re-soft:light-dark(#e6f1e7,#354e3b); --re-floor:light-dark(#f3f0e7,#30382e);
 --re-wood:light-dark(#fffcf3,#4e4d3c); --re-edge:light-dark(#bfb69d,#a09f82); --re-chair:light-dark(#d1c6ad,#858369);
 --re-wall:light-dark(#8b998b,#8e9e90); --re-red:light-dark(#a3443e,#f0a39b);
 color:var(--re-ink); background:var(--re-bg); border:1px solid var(--re-line); border-radius:16px; overflow:hidden;
 font:14px/1.45 "Segoe UI",system-ui,sans-serif;
}
#maex-room-editor * {box-sizing:border-box;}
#maex-room-editor h2,#maex-room-editor h3,#maex-room-editor p {margin:0;}
#maex-room-editor button,#maex-room-editor input,#maex-room-editor select {font:inherit;}
#maex-room-editor .re-head {display:flex;gap:13px;align-items:center;padding:19px 105px 19px 21px;background:var(--re-panel);}
#maex-room-editor .re-room-bar {display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 18px 14px;background:var(--re-panel);}
#maex-room-editor .re-room-tabs {display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0;}
#maex-room-editor .re-room-tab {max-width:100%;overflow-wrap:anywhere;text-align:left;}
#maex-room-editor .re-room-tab[aria-current="page"] {background:var(--re-soft);border-color:var(--re-green);color:var(--re-green);}

#maex-room-editor .re-room-form[hidden] {display:none;}
#maex-room-editor .re-room-form h3 {font-size:16px;font-weight:500;margin-bottom:12px;}

#maex-room-editor .re-room-form-actions {display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}

#maex-room-editor .re-advanced {display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--re-line);color:var(--re-ink);font-size:13px;}

#maex-room-editor .re-advanced input {appearance:none;width:36px;height:21px;border-radius:12px;border:1px solid var(--re-line);background:var(--re-line);position:relative;flex:none;}

#maex-room-editor .re-advanced input:checked::before {left:17px;}
#maex-room-editor .re-custom-size {font-size:12px;color:var(--re-sub);}
#maex-room-editor .re-table-actions {display:grid;grid-template-columns:1fr 1fr;gap:8px;}

#maex-room-editor .re-room-empty {position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--re-sub);font-size:13px;text-align:center;max-width:85%;pointer-events:none;}

#maex-room-editor h2 {font-size:22px;font-weight:500;line-height:1.25;}
#maex-room-editor .re-sub {color:var(--re-sub);font-size:12px;}
#maex-room-editor .re-tools {display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:12px 16px;border-block:1px solid var(--re-line);background:var(--re-panel);}
#maex-room-editor .re-btn {display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:8px 11px;border:1px solid var(--re-line);border-radius:8px;background:var(--re-panel);color:var(--re-ink);}
#maex-room-editor .re-btn:hover {background:var(--re-soft);}
#maex-room-editor .re-btn[aria-pressed="true"] {color:var(--re-on);background:var(--re-green);border-color:var(--re-green);}
#maex-room-editor .re-btn:disabled {opacity:.45;}
#maex-room-editor svg:not(.re-connections) {width:16px;height:16px;flex:none;}
#maex-room-editor .re-tools .re-undo {margin-left:auto;}
#maex-room-editor .re-content {display:grid;grid-template-columns:minmax(0,1fr) 265px;align-items:stretch;}
#maex-room-editor .re-work {min-width:0;display:flex;flex-direction:column;}
#maex-room-editor .re-context {display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;padding:14px 18px 0;}
#maex-room-editor .re-room-summary {padding:6px 0;border:0;background:transparent;color:var(--re-ink);font-weight:500;display:flex;align-items:center;gap:7px;}
#maex-room-editor .re-grid-control {display:flex;gap:6px;align-items:center;color:var(--re-sub);font-size:12px;}
#maex-room-editor .re-grid-control input {width:16px;height:16px;accent-color:var(--re-green);}
#maex-room-editor .re-stage {height:500px;position:relative;margin:0 14px;min-width:0;}
#maex-room-editor .re-floor {position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--re-floor);isolation:isolate;touch-action:none;}
#maex-room-editor .re-floor.re-grid {background-image:radial-gradient(circle,color-mix(in srgb,var(--re-wall) 38%,transparent) .8px,transparent 1px);}
#maex-room-editor .re-floor.re-drawing {cursor:crosshair;}
#maex-room-editor .re-floor.re-drawing .re-object,#maex-room-editor .re-floor.re-drawing .re-endpoint {pointer-events:none;}
#maex-room-editor .re-outer {position:absolute;background:var(--re-wall);pointer-events:none;z-index:0;}
#maex-room-editor .re-dimension {position:absolute;color:var(--re-sub);font-size:11px;white-space:nowrap;pointer-events:none;}
#maex-room-editor .re-dimension-x {left:50%;top:-26px;transform:translateX(-50%);}

#maex-room-editor .re-piece-text {display:flex;flex-direction:column;align-items:center;transform:rotate(calc(-1 * var(--re-angle)));pointer-events:none;white-space:nowrap;}
#maex-room-editor .re-piece-name {font-size:13px;font-weight:500;}
#maex-room-editor .re-piece-seats {font-size:11px;color:var(--re-sub);}
#maex-room-editor .re-counter .re-piece {background:var(--re-chair);border-radius:4px;}
#maex-room-editor .re-counter.re-selected .re-piece {background:var(--re-soft);}
#maex-room-editor .re-counter .re-piece-name {font-size:12px;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis;text-align:center;}
#maex-room-editor .re-chair {position:absolute;transform:translate(-50%,-50%) rotate(var(--chair-angle,0deg));background:var(--re-chair);border-radius:2px;pointer-events:none;}
#maex-room-editor .re-wall-object {transform:translate(-50%,-50%) rotate(var(--re-angle));}
#maex-room-editor .re-wall-hit {position:absolute;inset:0;border:0;padding:0;width:100%;height:100%;background:transparent;}
#maex-room-editor .re-wall-bar {position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:var(--re-thickness);background:var(--re-wall);pointer-events:none;}
#maex-room-editor .re-selected .re-wall-bar {background:var(--re-green);box-shadow:0 0 0 4px color-mix(in srgb,var(--re-green) 15%,transparent);}
#maex-room-editor .re-wall-measure {position:absolute;left:50%;top:calc(50% - 23px);transform:translate(-50%,-100%);font-size:11px;color:var(--re-green);white-space:nowrap;pointer-events:none;}
#maex-room-editor .re-endpoint {position:absolute;width:16px;height:16px;padding:0;transform:translate(-50%,-50%);border:2px solid var(--re-green);background:var(--re-panel);border-radius:50%;z-index:7;touch-action:none;cursor:crosshair;}
#maex-room-editor .re-endpoint::after {content:"";position:absolute;inset:-7px;}
#maex-room-editor .re-door-gap {position:absolute;background:var(--re-floor);transform:translate(-50%,-50%);pointer-events:none;border-inline:2px solid var(--re-green);}
#maex-room-editor .re-door.re-side .re-door-gap {border-inline:0;border-block:2px solid var(--re-green);}
#maex-room-editor .re-door-button {position:absolute;transform:translate(-50%,-50%);border:1px dashed var(--re-green);border-radius:5px;padding:4px 7px;background:var(--re-soft);color:var(--re-ink);font-size:11px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;}
#maex-room-editor .re-selected .re-door-button {border:2px solid var(--re-green);}
#maex-room-editor .re-label-button {display:block;transform:translate(-50%,-50%);padding:3px 5px;border:1px solid transparent;background:transparent;color:var(--re-ink);border-radius:5px;max-width:160px;white-space:normal;overflow-wrap:anywhere;}
#maex-room-editor .re-selected .re-label-button {border:1px dashed var(--re-green);background:var(--re-soft);}
#maex-room-editor .re-hint {min-height:40px;padding:0 18px 14px;color:var(--re-sub);font-size:12px;}
#maex-room-editor .re-aside {padding:18px;background:var(--re-panel);border-left:1px solid var(--re-line);min-width:0;}
#maex-room-editor .re-aside h3 {font-size:18px;font-weight:500;margin:18px 0 14px;}
#maex-room-editor .re-field {display:grid;gap:6px;min-width:0;}
#maex-room-editor .re-field>span {font-size:12px;color:var(--re-sub);}
#maex-room-editor .re-input {width:100%;min-width:0;min-height:39px;border:1px solid var(--re-line);border-radius:7px;background:var(--re-panel);color:var(--re-ink);padding:7px 9px;}
#maex-room-editor .re-field-grid {display:grid;grid-template-columns:1fr 1fr;gap:13px 10px;}
#maex-room-editor .re-full {grid-column:1 / -1;}
#maex-room-editor .re-stepper {display:flex;align-items:center;border:1px solid var(--re-line);border-radius:8px;overflow:hidden;}
#maex-room-editor .re-stepper .re-btn {border:0;border-radius:0;min-width:42px;}
#maex-room-editor .re-stepper input {width:100%;min-width:0;border:0;background:var(--re-panel);color:var(--re-ink);text-align:center;padding:7px 0;appearance:textfield;}
#maex-room-editor .re-stepper input::-webkit-inner-spin-button {appearance:none;}
#maex-room-editor .re-delete {color:var(--re-red);margin-top:18px;}
#maex-room-editor .re-meta {font-size:12px;color:var(--re-sub);margin-top:14px;}
#maex-room-editor .re-combos {margin-top:18px;border-top:1px solid var(--re-line);padding-top:13px;}
#maex-room-editor .re-combos summary {font-size:12px;color:var(--re-sub);}
#maex-room-editor .re-combo-buttons {display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
#maex-room-editor .re-combo-buttons .re-btn {padding:5px 8px;min-height:34px;}
#maex-room-editor .re-foot {display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--re-line);padding:12px 18px;background:var(--re-panel);font-size:12px;}
#maex-room-editor .re-status {padding:0 18px 12px;background:var(--re-panel);color:var(--re-sub);font-size:12px;min-height:30px;}
#maex-room-editor .re-status.re-error {color:var(--re-red);}
@media(max-width:740px){#maex-room-editor .re-content{grid-template-columns:minmax(0,1fr) 225px;}#maex-room-editor .re-aside{padding:14px;}#maex-room-editor .re-stage{height:460px;margin:0 6px;}#maex-room-editor .re-context{padding-inline:12px;}#maex-room-editor .re-piece-seats{display:none;}}
@media(max-width:580px){#maex-room-editor .re-content{grid-template-columns:1fr;}#maex-room-editor .re-aside{border-left:0;border-top:1px solid var(--re-line);padding:16px;}#maex-room-editor .re-stage{height:380px;margin:0 8px;}#maex-room-editor .re-head{padding:16px 96px 16px 14px;}#maex-room-editor h2{font-size:19px;}#maex-room-editor .re-head .re-sub{font-size:11px;}#maex-room-editor .re-logo{width:30px;height:30px;font-size:17px;}#maex-room-editor .re-tools{padding:10px;gap:6px;}#maex-room-editor .re-tools .re-btn{font-size:12px;padding:7px 8px;}#maex-room-editor .re-tools .re-undo{margin-left:0;}#maex-room-editor .re-input{font-size:16px;}#maex-room-editor .re-piece-name{font-size:11px;}#maex-room-editor .re-room-bar{padding-inline:12px;}#maex-room-editor .re-room-form-fields{grid-template-columns:1fr 1fr;}}
@media(pointer:coarse){#maex-room-editor .re-btn,#maex-room-editor .re-input{min-height:44px;}#maex-room-editor .re-endpoint::after{inset:-14px;}}
</style>
<div id="maex-room-editor" aria-label="Raumplan mit frei bearbeitbarem Grundriss">
 <header class="re-head"><div class="re-logo" aria-hidden="true">m</div><div><h2>Raumplan</h2><p class="re-sub">Interaktiver Entwurf · Beispieldaten</p></div></header>
 <div class="re-room-bar"><nav class="re-room-tabs" aria-label="Räume und Terrassen"></nav><button type="button" class="re-btn cursor-interaction" data-action="newRoom">Neuer Raum</button></div>
 <form class="re-room-form" hidden aria-label="Raum oder Terrasse erstellen">
  <h3>Raum oder Terrasse erstellen</h3>
  <div class="re-room-form-fields">
   <label class="re-field"><span>Name</span><input class="re-input" name="areaName" type="text" maxlength="30" required value="Nebenraum"></label>
   <label class="re-field"><span>Bereich</span><select class="re-input" name="areaKind"><option value="inside">Innenraum</option><option value="terrace">Terrasse</option></select></label>
   <label class="re-field"><span>Breite (m)</span><input class="re-input" name="areaWidth" type="number" min="3" max="30" step="0.1" value="8" required></label>
   <label class="re-field"><span>Tiefe (m)</span><input class="re-input" name="areaHeight" type="number" min="3" max="30" step="0.1" value="6" required></label>
  </div>
  <div class="re-room-form-actions"><button class="re-btn re-primary cursor-interaction" type="button" data-action="createRoom">Bereich erstellen</button><button class="re-btn cursor-interaction" type="button" data-action="cancelRoom">Abbrechen</button></div>
 </form>
 <div class="re-tools" aria-label="Objekte und Zeichenwerkzeuge">
  <button type="button" class="re-btn cursor-interaction" data-tool="select" aria-pressed="true">Auswählen</button>
  <button type="button" class="re-btn cursor-interaction" data-add="table">Tisch</button>
  <button type="button" class="re-btn cursor-interaction" data-add="counter">Theke</button>
  <button type="button" class="re-btn cursor-interaction" data-add="door">Eingang</button>
  <button type="button" class="re-btn cursor-interaction" data-tool="wall" aria-pressed="false">Wand zeichnen</button>
  <button type="button" class="re-btn cursor-interaction" data-add="label">Text</button>
  <button type="button" class="re-btn re-undo cursor-interaction" data-action="undo" disabled aria-label="Letzte Änderung rückgängig machen">Rückgängig</button>
 </div>
 <div class="re-content">
  <div class="re-work">
   <div class="re-context"><button type="button" class="re-room-summary cursor-interaction" data-action="room"><span class="re-room-value">10 × 7 m · Raum anpassen</span></button><label class="re-grid-control"><input type="checkbox" data-field="grid" checked>10-cm-Raster</label></div>
   <div class="re-stage"><div class="re-floor re-grid" aria-label="Grundriss. Objekte auswählen und ziehen; Pfeiltasten verschieben die Auswahl."><div class="re-dimension re-dimension-x"></div><div class="re-dimension re-dimension-y"></div><svg class="re-connections" aria-hidden="true"></svg><div class="re-outer" data-side="top"></div><div class="re-outer" data-side="right"></div><div class="re-outer" data-side="bottom"></div><div class="re-outer" data-side="left"></div></div></div>
   <p class="re-hint">Objekte ziehen · Wände an den Endpunkten ändern · Pfeiltasten verschieben</p>
  </div>
  <aside class="re-aside" aria-label="Eigenschaften"><label class="re-field"><span>Auswahl</span><select class="re-input" data-field="selection"></select></label><div class="re-properties"></div></aside>
 </div>
 <footer class="re-foot"><span class="re-total"></span><span class="re-sub">Nur Vorschau · kein produktiver Raumplan</span></footer>
 <div class="re-status" role="status" aria-live="polite">Raumgröße, Eingänge und Möbel sind frei anpassbar.</div>
</div>
<script>
(() => {
 const root=document.getElementById('maex-room-editor'), floor=root.querySelector('.re-floor'), stage=root.querySelector('.re-stage'), props=root.querySelector('.re-properties');
 const initial={version:3,advanced:false,otherRooms:[],room:{id:'r1',name:'Gastraum',kind:'inside',w:1000,h:700,shape:'rectangle',thickness:20},selected:'room',grid:true,links:[],nextId:12,objects:[
  {id:'o1',type:'table',name:'T1',x:170,y:180,w:120,h:80,seats:4,shape:'rect',angle:0},
  {id:'o2',type:'table',name:'T2',x:440,y:180,w:120,h:80,seats:4,shape:'rect',angle:0},
  {id:'o3',type:'table',name:'T3',x:710,y:170,w:110,h:110,seats:4,shape:'round',angle:0},
  {id:'o4',type:'table',name:'T4',x:170,y:465,w:120,h:80,seats:4,shape:'rect',angle:0},
  {id:'o5',type:'table',name:'T5',x:440,y:465,w:160,h:80,seats:6,shape:'rect',angle:0},
  {id:'o6',type:'table',name:'T6',x:710,y:465,w:80,h:80,seats:2,shape:'rect',angle:0},
  {id:'o7',type:'table',name:'T7',x:430,y:330,w:80,h:80,seats:2,shape:'rect',angle:0},
  {id:'o8',type:'counter',name:'Theke',x:880,y:450,w:80,h:260,angle:0},
  {id:'o9',type:'door',name:'Eingang',side:'bottom',offset:150,width:110},
  {id:'o10',type:'wall',name:'Trennwand',x:800,y:170,length:200,angle:90,thickness:20},
  {id:'o11',type:'label',text:'Fensterseite',x:200,y:55,font:14}
 ]};
 let state=structuredClone(initial), scale=1, mode='select', drag=null, drawStart=null, preview=null, history=[], ignoreClickUntil=0;
 const options={chairs:true};
 const tablePresets={rect:[[80,80],[120,80],[140,80],[160,80],[180,90],[200,100]],round:[[80,80],[100,100],[110,110],[120,120],[140,140]]};
 const fmt=(n,d=2)=>new Intl.NumberFormat('de-DE',{maximumFractionDigits:d}).format(n);
 const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const selected=()=>state.objects.find(o=>o.id===state.selected);
 const label=o=>({table:'Tisch ',counter:'',door:'',wall:''}[o.type]??'')+(o.type==='label'?o.text:o.name);
 const snap=n=>state.grid?Math.round(n/10)*10:Math.round(n);
 const rad=a=>a*Math.PI/180;
 function snapshot(){return structuredClone(state);}

  const tables=state.objects.filter(o=>o.type==='table');root.querySelector('.re-total').textContent=state.room.name+' · '+tables.length+' Tische · '+tables.reduce((n,o)=>n+o.seats,0)+' Plätze · '+fmt(state.room.w*state.room.h/10000)+' m²';root.querySelector('.re-hint').textContent=mode==='wall'?'Zwei Punkte setzen oder ziehen · Esc bricht ab':'Objekte ziehen · Wände an den Endpunkten ändern · Pfeiltasten verschieben';
 }
 function render(){controls();inspector();layout();}
 function commit(message,before){if(before&&new TextEncoder().encode(JSON.stringify(state)).byteLength>14500){state=before;render();status('Die Vorschau ist voll. Bitte zuerst nicht benötigte Objekte entfernen.',true);return false;}if(before)remember(before);render();persist();status(message+' · nur Vorschau');return true;}
 function choose(id){state.selected=id;mode='select';drawStart=null;preview=null;render();persist();}
 function activateRoom(id){const index=state.otherRooms.findIndex(a=>a.room.id===id);if(index<0)return;const target=state.otherRooms[index],current=activeData(),others=state.otherRooms.filter((a,i)=>i!==index);Object.assign(state,target);state.otherRooms=[...others,current];mode='select';drawStart=null;preview=null;}
 function nextTableName(){const names=new Set(areas().flatMap(a=>a.objects.filter(o=>o.type==='table').map(o=>o.name)));let n=1;while(names.has('T'+n))n++;return 'T'+n;}
 function placeCopy(o,source){
  const [w,h]=footprint(o),r=state.room,candidates=[[source.x+w+45,source.y],[source.x,source.y+h+45],[source.x-w-45,source.y],[source.x,source.y-h-45]];
  for(let y=h/2+30;y<r.h-h/2-20;y+=h+45)for(let x=w/2+30;x<r.w-w/2-20;x+=w+45)candidates.push([x,y]);
  for(const [x,y]of candidates){if(x<w/2+20||x>r.w-w/2-20||y<h/2+20||y>r.h-h/2-20)continue;
   const free=state.objects.filter(a=>a.type==='table'||a.type==='counter').every(a=>{const [aw,ah]=footprint(a);return Math.abs(a.x-x)>(aw+w)/2+25||Math.abs(a.y-y)>(ah+h)/2+25;});if(free){o.x=x;o.y=y;return;}}
  o.x=source.x+40;o.y=source.y+40;fit(o);
 }
 function cloneTable(){const source=selected();if(!source||source.type!=='table'||objectCount()>=100)return;const before=snapshot(),copy=structuredClone(source);copy.id='o'+state.nextId++;copy.name=nextTableName();placeCopy(copy,source);state.objects.push(copy);state.selected=copy.id;commit('Tisch '+source.name+' als '+copy.name+' kopiert',before);}
 function available(o){if(!['table','counter'].includes(o.type))return true;const [w,h]=footprint(o),pad=o.type==='table'?40:10;return w+pad<=state.room.w&&h+pad<=state.room.h;}
 function add(type){
  if(objectCount()>=100){status('Die Vorschau umfasst höchstens 100 Objekte über alle Räume.',true);return;}
  const before=snapshot(),id='o'+state.nextId++,x=state.room.w*.5+((state.objects.length%3)-1)*60,y=state.room.h*.5;let o;
  if(type==='table')o={id,type,name:nextTableName(),x,y,w:120,h:80,angle:0,shape:'rect',seats:4,headSide:'left'};
  if(type==='counter')o={id,type,name:'Theke',x,y,w:80,h:220,angle:0};
  if(type==='door')o={id,type,name:'Eingang',side:'bottom',offset:state.room.w*.7,width:100};
  if(type==='label')o={id,type,text:'Beschriftung',x,y,font:14};
  fit(o);state.objects.push(o);state.selected=id;mode='select';drawStart=null;preview=null;const added=commit('Objekt hinzugefügt',before);
  if(added&&type==='label'){const input=props.querySelector('[data-field="text"]');input.focus();input.select();}
 }
 function finishWall(a,b){
  if(Math.hypot(b.x-a.x,b.y-a.y)<20){status('Die Wand muss mindestens 20 cm lang sein.',true);return false;}
  if(objectCount()>=100){status('Die Vorschau umfasst höchstens 100 Objekte über alle Räume.',true);return false;}
  const before=snapshot(),o={id:'o'+state.nextId++,type:'wall',name:'Wand',thickness:20};wallFromPoints(o,a,b);fit(o);state.objects.push(o);state.selected=o.id;drawStart=null;preview=null;mode='select';commit('Wand gezeichnet',before);return true;
 }
 root.addEventListener('click',event=>{
  if(Date.now()<ignoreClickUntil&&floor.contains(event.target))return;
  const b=event.target.closest('button');if(!b)return;
  if(b.dataset.roomId){activateRoom(b.dataset.roomId);root.querySelector('.re-room-form').hidden=true;render();persist();status(state.room.name+' geöffnet.');return;}
  if(b.dataset.tool){mode=b.dataset.tool;drawStart=null;preview=null;controls();renderScene();return;}
  if(b.dataset.add){add(b.dataset.add);return;}
  if(b.dataset.partner){const o=selected();if(!o)return;const before=snapshot(),id=b.dataset.partner,index=state.links.findIndex(p=>p.includes(o.id)&&p.includes(id));if(index<0)state.links.push([o.id,id]);else state.links.splice(index,1);commit('Kombination angepasst',before);return;}
  const action=b.dataset.action,o=selected();
  if(action==='newRoom'){const form=root.querySelector('.re-room-form');form.hidden=false;form.elements.areaName.focus();form.elements.areaName.select();return;}
  if(action==='cancelRoom'){root.querySelector('.re-room-form').hidden=true;return;}
  if(action==='createRoom'){createRoom();return;}
  if(action==='clone'){cloneTable();return;}
  if(action==='room'){choose('room');return;}
  if(action==='undo'){if(history.length){state=history.pop();mode='select';drawStart=null;preview=null;render();persist();status('Letzte Änderung rückgängig gemacht.');}return;}
  if(action&&o){const before=snapshot();if(action==='delete'){state.objects=state.objects.filter(x=>x.id!==o.id);state.links=state.links.filter(p=>!p.includes(o.id));state.selected='room';}
   if(action==='plus')o.seats=Math.min(20,o.seats+1);if(action==='minus')o.seats=Math.max(1,o.seats-1);
   if(action==='rotate'){o.angle=(o.angle+90)%360;if(!available(o)){state=before;status('Für diese Ausrichtung ist der Raum zu klein.',true);return;}fit(o);}
   commit(action==='delete'?'Objekt entfernt':'Objekt angepasst',before);return;
  }
  if(floor.contains(b)&&mode==='select'){const id=b.closest('[data-id]')?.dataset.id;if(id)choose(id);}
 });
 function createRoom(){
  const form=root.querySelector('.re-room-form');if(!form.reportValidity()||state.otherRooms.length>=7)return;
  const name=form.elements.areaName.value.trim();if(!name){form.elements.areaName.focus();return;}
  if(areas().some(a=>a.room.name.toLocaleLowerCase('de-DE')===name.toLocaleLowerCase('de-DE'))){status('Dieser Raumname ist schon vergeben. Bitte einen anderen Namen wählen.',true);return;}
  const before=snapshot(),id='r'+(Math.max(...areas().map(a=>Number(a.room.id.slice(1))))+1),w=Math.round(Number(form.elements.areaWidth.value)*100),h=Math.round(Number(form.elements.areaHeight.value)*100);
  const area={room:{id,name,kind:form.elements.areaKind.value,w,h,shape:w===h?'square':'rectangle',thickness:20},objects:[],links:[],nextId:1,selected:'room'};
  state.otherRooms.push(area);activateRoom(id);if(commit(name+' erstellt',before))form.hidden=true;
 }
 root.querySelector('.re-room-form').addEventListener('submit',event=>{event.preventDefault();createRoom();});
 root.querySelector('[name="areaKind"]').addEventListener('change',event=>{const field=root.querySelector('[name="areaName"]');if(['Nebenraum','Terrasse'].includes(field.value))field.value=event.target.value==='terrace'?'Terrasse':'Nebenraum';});
 root.addEventListener('change',event=>{
  const field=event.target.dataset.field;if(!field)return;
  if(field==='selection'){choose(event.target.value);return;}
  const before=snapshot(),o=selected(),r=state.room,raw=event.target.value,n=Number(raw);
  if(event.target.type==='number'&&(raw.trim()===''||!Number.isFinite(n)||!event.target.checkValidity())){render();status('Bitte einen gültigen Wert innerhalb des angezeigten Bereichs eingeben.',true);return;}
  if(field==='grid')state.grid=event.target.checked;
  else if(field==='advanced')state.advanced=event.target.checked;
  else if(field==='roomName'){const name=raw.trim().slice(0,30);if(!name||state.otherRooms.some(a=>a.room.name.toLocaleLowerCase('de-DE')===name.toLocaleLowerCase('de-DE'))){render();status('Bitte einen freien Raumnamen eingeben.',true);return;}r.name=name;}
  else if(field==='roomKind')r.kind=raw;
  else if(field==='roomShape'){r.shape=raw;if(raw==='square')r.h=r.w;}
  else if(field==='roomW'){r.w=Math.round(n*100);if(r.shape==='square')r.h=r.w;}
  else if(field==='roomH'){r.h=Math.round(n*100);if(r.shape==='square')r.w=r.h;}
  else if(field==='roomThickness')r.thickness=n;
  else if(o){
   if(field==='name')o.name=raw.trim().slice(0,25)||o.name;if(field==='text')o.text=raw.trim().slice(0,60)||'Beschriftung';if(field==='seats')o.seats=clamp(Math.round(n),1,20);if(field==='font')o.font=n;
   if(field==='shape'){o.shape=raw;o.w=120;o.h=raw==='round'?120:80;o.angle=0;}
   if(field==='preset'){const size=tablePresets[o.shape].find(([w,h])=>w+'x'+h===raw);if(size)[o.w,o.h]=size;}
   if(field==='headSide')o.headSide=raw;
   if(field==='w'&&(o.type!=='table'||state.advanced)){o.w=n;if(o.shape==='round')o.h=n;}if(field==='h'&&(o.type!=='table'||state.advanced))o.h=n;
   if(field==='length')o.length=n*100;if(field==='thickness')o.thickness=n;if(field==='angle')o.angle=n;if(field==='side')o.side=raw;if(field==='doorWidth')o.width=n;if(field==='offset')o.offset=n;
  }
  const tooLarge=state.objects.find(x=>!available(x));if(tooLarge){state=before;render();status('Raum oder Möbelmaß passt nicht: '+label(tooLarge)+' ist dafür zu groß.',true);return;}
  let moved=0;state.objects.forEach(x=>{const old=JSON.stringify(x);fit(x);if(JSON.stringify(x)!==old)moved++;});
  commit(field==='advanced'?(state.advanced?'Individuelle Tischmaße freigeschaltet':'Individuelle Tischmaße gesperrt'):field.startsWith('room')?'Raum angepasst'+(moved?' · '+moved+' Objekte an den Raum angepasst':''):'Eigenschaften angepasst',before);
 });
 floor.addEventListener('pointerdown',event=>{
  if(event.button!==0||!event.isPrimary)return;
  const p=point(event);
  if(mode==='wall'){event.preventDefault();drag={type:'draw',pointerId:event.pointerId,start:drawStart||p,wasStarted:!!drawStart,startScreen:{x:event.clientX,y:event.clientY}};drawStart=drag.start;preview={a:drawStart,b:p};floor.setPointerCapture(event.pointerId);renderScene();return;}
  const target=event.target.closest('[data-id]');if(!target){state.selected='room';inspector();renderScene();return;}
  const o=state.objects.find(x=>x.id===target.dataset.id);if(!o)return;
  event.preventDefault();state.selected=o.id;const endpoint=event.target.closest('[data-endpoint]')?.dataset.endpoint;
  drag={type:endpoint===undefined?'move':'endpoint',endpoint:Number(endpoint),pointerId:event.pointerId,before:snapshot(),original:structuredClone(o),id:o.id,start:p,moved:false,startScreen:{x:event.clientX,y:event.clientY}};
  floor.setPointerCapture(event.pointerId);inspector();renderScene();(endpoint===undefined?floor.querySelector(`[data-id="${o.id}"] button`):floor.querySelector(`[data-endpoint="${endpoint}"]`))?.focus({preventScroll:true});
 });
 floor.addEventListener('pointermove',event=>{
  const p=point(event);
  if(!drag){if(mode==='wall'&&drawStart){preview={a:drawStart,b:p};renderScene();}return;}
  if(event.pointerId!==drag.pointerId)return;
  if(drag.type==='draw'){preview={a:drag.start,b:p};renderScene();return;}
  if(Math.hypot(event.clientX-drag.startScreen.x,event.clientY-drag.startScreen.y)<3&&!drag.moved)return;
  drag.moved=true;const o=state.objects.find(x=>x.id===drag.id),original=drag.original,dx=p.x-drag.start.x,dy=p.y-drag.start.y;
  if(drag.type==='endpoint'){const ends=endpoints(original);ends[drag.endpoint]=p;wallFromPoints(o,ends[0],ends[1]);if(o.length<20)o.length=20;fit(o);}
  else if(o.type==='door'){const start=doorPoint(original);moveDoor(o,{x:start.x+dx,y:start.y+dy});}
  else{o.x=original.x+dx;o.y=original.y+dy;fit(o);}
  renderScene();
 });
 function endPointer(event){
  if(!drag||event.pointerId!==drag.pointerId)return;const d=drag;drag=null;
  if(floor.hasPointerCapture(event.pointerId))floor.releasePointerCapture(event.pointerId);ignoreClickUntil=Date.now()+180;
  if(event.type==='pointercancel'){if(d.before)state=d.before;drawStart=null;preview=null;render();status('Bewegung abgebrochen.');return;}
  if(d.type==='draw'){const p=point(event),moved=Math.hypot(event.clientX-d.startScreen.x,event.clientY-d.startScreen.y)>4;if(moved||d.wasStarted)finishWall(d.start,p);else{preview={a:d.start,b:d.start};renderScene();status('Jetzt den zweiten Wandpunkt setzen.');}return;}
  if(d.moved)commit('Objekt verschoben',d.before);else{render();persist();}
 }
 floor.addEventListener('pointerup',endPointer);floor.addEventListener('pointercancel',endPointer);
 root.addEventListener('keydown',event=>{
  if(event.key==='Enter'&&root.querySelector('.re-room-form').contains(event.target)){event.preventDefault();createRoom();return;}
  if(event.key==='Escape'){if(drag?.before)state=drag.before;drag=null;drawStart=null;preview=null;mode='select';render();status('Zeichnen oder Verschieben abgebrochen.');return;}
  if(event.target.matches('input,select,textarea'))return;
  if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='z'){event.preventDefault();root.querySelector('[data-action="undo"]').click();return;}
  if(event.key==='Delete'&&selected()){event.preventDefault();root.querySelector('[data-action="delete"]').click();return;}
  const delta={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[event.key];
  if(!delta||!floor.contains(event.target)||!selected())return;event.preventDefault();const before=snapshot(),o=selected(),unit=event.shiftKey?1:(state.grid?10:5),endpoint=event.target.dataset.endpoint;
  if(o.type==='wall'&&endpoint!==undefined){const ends=endpoints(o),p=ends[Number(endpoint)];p.x=clamp(p.x+delta[0]*unit,0,state.room.w);p.y=clamp(p.y+delta[1]*unit,0,state.room.h);wallFromPoints(o,ends[0],ends[1]);}
  else if(o.type==='door'){const p=doorPoint(o);moveDoor(o,{x:p.x+delta[0]*unit,y:p.y+delta[1]*unit});}
  else{o.x+=delta[0]*unit;o.y+=delta[1]*unit;}
  fit(o);commit('Objekt verschoben',before);
 });
 restore(window.floorPlanPreview?.widgetState);render();new ResizeObserver(()=>layout()).observe(stage);
})();
