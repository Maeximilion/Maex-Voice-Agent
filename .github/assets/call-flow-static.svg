<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">How a call flows</title>
<desc id="d">A call from caller to team: phone line, speech to text, the conversation core that fans out to the language model, menu lookup, hours and slots, cart and prices, which converge in the domain and Postgres where code decides; then the kitchen slip and the team tablet. The reply goes back through text to speech. Built: Speech to text, Text to speech, Conversation core, Menu lookup, Hours and slots, Cart and prices, Domain Postgres, Kitchen slip, Team tablet, Outbox n8n. Not finished: Phone line Asterisk, LLM.</desc>
