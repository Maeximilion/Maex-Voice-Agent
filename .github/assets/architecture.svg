<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="704" viewBox="0 0 1200 704" role="img" aria-labelledby="t d">
<title id="t">Architecture</title>
<desc id="d">The architecture in two bands. The hot path, while the caller is on the line: the caller reaches the access, router or SIP trunk, and Asterisk, our own exchange; the ear turns speech into text for the conversation core, the mouth speaks its reply. The core asks the LLM, which connects to the core only, and runs the tools get_service_status, search_menu, draft_order and confirm against Postgres, in the voice process without HTTP, each within a 300 ms budget at p95 with a local database. confirm writes the order, the hinge to the cold path after the yes: the tablet shows it, the print bridge fetches the order slip, and the outbox carries events through the dispatcher to n8n and the push, retried with backoff and then an alarm. The team phone stands in the cold band but is rung during the call: the exchange rings it on a transfer or when the service voice is down. Built: Asterisk our exchange, Ear speech to text, Mouth text to speech, Conversation core, guards, LLM understands, Open now? get_service_status, Menu search_menu, Order draft draft_order, Confirm confirm, Postgres the facts, Order slip print bridge, Tablet approval, Push outbox, n8n, Team phone rung during the call. Not finished: Access router, SIP.</desc>
