<text x="40" y="82" font-size="15" fill="#E8FF2E">Hot path while the caller is on the line, cold path after the yes.</text>
<rect x="40" y="104" width="1120" height="316" rx="14" fill="#17102B" opacity="0.55" stroke="#2B2148"/><text x="56" y="132" font-size="12" fill="#A89CCB" font-weight="700" letter-spacing="2">HOT PATH</text>
<text x="176" y="132" font-size="13" fill="#A89CCB">The caller waits: core and tools run in the voice process, no HTTP; each tool has a 300 ms budget (p95, local database).</text>
<rect x="40" y="460" width="1120" height="220" rx="14" fill="#17102B" opacity="0.55" stroke="#2B2148"/><text x="56" y="488" font-size="12" fill="#A89CCB" font-weight="700" letter-spacing="2">COLD PATH</text>
<text x="60" y="664" font-size="13" fill="#A89CCB">Seconds are fine here: the dispatcher retries a failed delivery with backoff, then raises an alarm. The print bridge fetches the slip.</text>
