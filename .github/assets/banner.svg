<text x="64" y="70" font-size="24" fill="#F1ECFF" font-weight="700">Maex Voice Agent</text>
<text x="64" y="100" font-size="15" fill="#A89CCB">An AI phone agent for restaurants: reservations, pickups, deliveries.</text>
<text x="64" y="152" font-size="14" fill="#A89CCB">the caller says</text>
<text x="64" y="184" font-size="19" fill="#F1ECFF">„Guten Tag, ich moechte etwas</text>
<text x="64" y="210" font-size="19" fill="#F1ECFF">zum Abholen bestellen.“</text>
<text x="64" y="236" font-size="19" fill="#F1ECFF">„Zweimal die 25.“</text>
