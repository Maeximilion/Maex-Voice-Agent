<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
<title id="t">MÆX banner</title>
<desc id="d">MÆX, Maex Voice Agent, an AI phone agent for restaurants. An example call from left to right: the caller orders dish 25 twice for pickup, the neon sign MÆX stands in the middle, and on the right lies the order slip, ready in about 30 minutes, read back, confirmed by the caller's yes.</desc>
<style>text{font-family:ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace}.wire{animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-20}}@media (prefers-reduced-motion:reduce){.wire{animation:none}}</style>
