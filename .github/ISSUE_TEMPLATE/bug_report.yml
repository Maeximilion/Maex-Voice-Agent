name: Report a bug
description: A bug in operation or in development
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security vulnerabilities here, follow `SECURITY.md`.
        Do not enter real customer data, phone numbers or addresses.

  - type: textarea
    id: was-passiert
    attributes:
      label: What happens
      description: Observed behavior, with the error message if there is one.
    validations:
      required: true

  - type: textarea
    id: erwartet
    attributes:
      label: What was expected
    validations:
      required: true

  - type: textarea
    id: nachstellen
    attributes:
      label: Steps to reproduce
      description: Call, input, time. For a tool call, the request without credentials.
      placeholder: |
        1. POST /v1/tools/check_slot with ...
        2. Response was ...
    validations:
      required: true

  - type: dropdown
    id: bereich
    attributes:
      label: Area
      options:
        - Agent API and tools
        - Domain logic
        - Database and migrations
        - User interface
        - Automation and events
        - Operations and deployment
        - unclear
    validations:
      required: true

  - type: input
    id: stand
    attributes:
      label: Version
      description: Commit, tag or date of the run.

  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: The relevant lines, not the whole log. Remove credentials first.
      render: text
