name: Work package or feature
description: Propose a new feature or extension
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Planned work packages are already listed in `docs/07_WORKPACKAGES.md` and have an issue there.
        This form is for everything that is not listed there yet.

  - type: textarea
    id: ziel
    attributes:
      label: Goal
      description: What should be possible afterwards that is not possible today.
    validations:
      required: true

  - type: textarea
    id: begruendung
    attributes:
      label: Why
      description: Which problem in operation this solves.
    validations:
      required: true

  - type: dropdown
    id: stufe
    attributes:
      label: Stage
      description: See the roadmap in `docs/01_STATUS.md`.
      options:
        - "0 Foundation"
        - "1 Reservations"
        - "2 Pickup"
        - "3 Delivery"
        - "4 Training"
        - "5 Operation"
        - unclear
    validations:
      required: true

  - type: textarea
    id: fertig
    attributes:
      label: How do we know it is done
      description: A checkable criterion, not a feeling.
    validations:
      required: true

  - type: textarea
    id: abhaengigkeiten
    attributes:
      label: Dependencies
      description: Work packages or decisions that must be in place first.
