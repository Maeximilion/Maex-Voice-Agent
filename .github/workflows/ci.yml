name: ci

on:
  push:
    branches: [main, "task/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yoki
          POSTGRES_PASSWORD: yoki
          POSTGRES_DB: yoki_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yoki -d yoki_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://yoki:yoki@localhost:5432/yoki_test
      AGENT_API_TOKEN: ci-token
      ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Status-Sync prüfen
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "kein Vergleichs-Commit vorhanden, Status-Sync-Check übersprungen"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}")
          if echo "$CHANGED" | grep -q '^docs/07_ARBEITSPAKETE\.md$' && ! echo "$CHANGED" | grep -q '^docs/01_STATUS\.md$'; then
            echo "::error::docs/07_ARBEITSPAKETE.md geändert, aber docs/01_STATUS.md nicht mitgezogen. Status per 'python scripts/status_bump.py' aktualisieren."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r api/requirements.txt
      - run: ruff check api scripts evals
      - run: ruff format --check api scripts evals
      - run: pytest -q
