name: ci

on:
  push:
    branches: [main, "task/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maex
          POSTGRES_PASSWORD: maex
          POSTGRES_DB: maex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maex -d maex_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://maex:maex@localhost:5432/maex_test
      AGENT_API_TOKEN: ci-token
      ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r api/requirements.txt
      - run: ruff check api scripts evals
      - run: ruff format --check api scripts evals
      - run: pytest -q
