name: ci

on:
  push:
    branches: [main, "task/**", "dev/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maex
          POSTGRES_PASSWORD: maex
          POSTGRES_DB: maex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maex -d maex_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://maex:maex@localhost:5432/maex_test
      AGENT_API_TOKEN: ci-token
      ENV: test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Status-Sync prüfen
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "kein Vergleichs-Commit vorhanden, Status-Sync-Check übersprungen"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}")
          if echo "$CHANGED" | grep -q '^docs/07_WORKPACKAGES\.md$' && ! echo "$CHANGED" | grep -q '^docs/01_STATUS\.md$'; then
            echo "::error::docs/07_WORKPACKAGES.md geändert, aber docs/01_STATUS.md nicht mitgezogen. Status per 'python scripts/status_bump.py' aktualisieren."
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r api/requirements.txt
      - run: ruff check api scripts evals printbridge
      - run: ruff format --check api scripts evals printbridge
      - run: pytest -q

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: API-Image ohne lokales Zertifikat bauen
        run: |
          test ! -e api/ca-bundle.crt
          docker build --tag maex-api:ci ./api
      - name: API ohne Bind-Mount starten
        run: |
          docker run --detach --name maex-api-smoke \
            --env ENV=test --env AGENT_API_TOKEN=ci-smoke-token \
            maex-api:ci
      - name: Health und Token-Auth prüfen
        run: |
          docker exec -i maex-api-smoke python - <<'PY'
          import json
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          base = "http://127.0.0.1:8000"

          def request(path, token=None):
              headers = {} if token is None else {"Authorization": f"Bearer {token}"}
              method = "GET" if path == "/health" else "POST"
              req = Request(base + path, headers=headers, method=method)
              try:
                  response = urlopen(req, timeout=2)
              except HTTPError as exc:
                  response = exc
              with response:
                  return response.status, json.load(response)

          # Uvicorn braucht nach dem Containerstart kurz Zeit zum Importieren.
          deadline = time.monotonic() + 60
          while True:
              try:
                  status, body = request("/health")
                  assert status == 200 and body == {"status": "ok", "env": "test"}, body
                  break
              except (URLError, TimeoutError):
                  if time.monotonic() >= deadline:
                      raise
                  time.sleep(1)

          for token in (None, "wrong-token"):
              status, body = request("/v1/tools/ping", token)
              assert status == 401, (status, body)
              assert body["ok"] is False, body

          status, body = request("/v1/tools/ping", "ci-smoke-token")
          assert status == 200 and body["ok"] is True, (status, body)
          assert body["data"]["pong"] is True, body
          print("Docker smoke: health, missing/wrong token, authenticated ping passed")
          PY
      - name: Container-Logs bei Fehler anzeigen
        if: failure()
        run: docker logs maex-api-smoke
      - name: Container entfernen
        if: always()
        run: docker rm --force maex-api-smoke || true
