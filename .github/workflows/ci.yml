name: ci

# Branches laufen ueber pull_request; ein zusaetzlicher push-Trigger fuer task/** und
# dev/** liess jeden Push auf einen PR-Branch doppelt laufen (CI-Analyse 03.10.2026).
on:
  push:
    branches: [main]
  pull_request:

# Neuer Push auf denselben PR bricht den alten Lauf ab. Auf main bekommt jeder Lauf
# eine eigene Gruppe (run_id): in einer gemeinsamen Gruppe haelt GitHub nur einen
# wartenden Lauf und ersetzt ihn, ein Zwischen-Commit bliebe ungetestet (Codex PR #161).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  # Which paths a pull request changes (#609). The Docker jobs build ./api only, so a
  # pull request that changes nothing but docs/, .claude/, scripts/ or Markdown at the
  # top level skips them; a skipped job counts as passed for a required check. The
  # tests always run: they read docs, CLAUDE.md, README, the hooks, commands and scripts.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.diff.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # A pull request checks out its merge commit, whose first parent is the base branch.
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            git diff --no-renames --name-only HEAD^1 HEAD | tee "$RUNNER_TEMP/files"
            python3 scripts/ci_changes.py < "$RUNNER_TEMP/files" | tee -a "$GITHUB_OUTPUT"
          else
            echo "image=true" | tee -a "$GITHUB_OUTPUT"
          fi

  # Guards, lint, types, the latency budget and the speech kit; the rest of the
  # suite runs in the shards of `pytest`.
  checks:
    runs-on: ubuntu-latest
    # Without a limit a hanging test holds the runner for GitHub's default of six hours.
    timeout-minutes: 15
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maex
          POSTGRES_PASSWORD: maex
          POSTGRES_DB: maex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maex -d maex_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://maex:maex@localhost:5432/maex_test
      AGENT_API_TOKEN: ci-token
      ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Status-Sync prüfen
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "kein Vergleichs-Commit vorhanden, Status-Sync-Check übersprungen"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}")
          if echo "$CHANGED" | grep -q '^docs/07_WORKPACKAGES\.md$' && ! echo "$CHANGED" | grep -q '^docs/01_STATUS\.md$'; then
            echo "::error::docs/07_WORKPACKAGES.md geändert, aber docs/01_STATUS.md nicht mitgezogen. Status per 'python scripts/status_bump.py' aktualisieren."
            exit 1
          fi
      # A tracked env file would publish its secrets in this public repository, and GitHub's
      # secret scanning only knows provider patterns. Templates end in .example. Every commit
      # of the push or pull request counts: one deleted again later stays in the history.
      - name: No tracked env file
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          range=
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            range=$(git log --diff-filter=AR --name-only --format= "$BASE..${{ github.sha }}")
          fi
          found=$(printf '%s\n%s\n' "$(git ls-files)" "$range" | grep -E '(^|/)\.env(\.[^/]+)?$' | grep -vE '\.example$' | sort -u || true)
          if [ -n "$found" ]; then
            echo "::error::Env file in the tree or in a commit of this push, remove it from the history and rotate its secrets: $found"
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      # The README images are drawn from docs/metrics/, the task list and the status
      # (stdlib only, before the install). Advisory since 2026-10-19: a stale image
      # shows here as a warning, the weekly README update redraws it
      # (docs/15_README_STRATEGY.md, "Keeping them current").
      - name: README images match their data (advisory)
        continue-on-error: true
        run: python scripts/readme_assets.py render --check
      # The compiled lock file: exact versions, every download checked against its hash.
      - run: pip install --require-hashes -r api/requirements.txt
      - run: ruff check api scripts evals printbridge sim db
      - run: ruff format --check api scripts evals printbridge sim db
      # Types, non-strict. Paths and settings: pyproject.toml, [tool.mypy].
      - run: mypy
      # Latency budget < 300 ms (CLAUDE.md §7), serially on a quiet runner and against
      # a database that keeps its durability, as production does.
      - name: Latenztests seriell
        run: pytest -q -m latency
      # The telephone line of the speech kit needs numpy, which the production
      # image must not carry: installed only here, after the full run, so that run
      # stays as it was. The version is the one api/requirements-voice.txt
      # pins for the voice and speech images; the hash is the cp312
      # manylinux x86_64 wheel. A skip in this file fails the step (#207).
      - name: Speech kit tests with numpy
        shell: bash
        run: |
          echo "numpy==2.5.4 --hash=sha256:fbde6962867ee75b48b0ee29b2b9372ec5d617799dbaf38e82dc0596f2f7738a" > "$RUNNER_TEMP/numpy.txt"
          pip install --require-hashes --no-deps -r "$RUNNER_TEMP/numpy.txt"
          pytest -q -rs api/tests/test_telephony_speech_bench.py | tee "$RUNNER_TEMP/bench.txt"
          ! grep -q skipped "$RUNNER_TEMP/bench.txt"

  # The suite without the latency tests, split over parallel jobs by a hash of the
  # test id (`PYTEST_SHARD`, api/tests/conftest.py); one more shard is one more
  # entry in `shard`. Inside a job on all cores; each worker keeps one database
  # and empties it after every test (evals/scratch_db.py, empty_scratch_db).
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maex
          POSTGRES_PASSWORD: maex
          POSTGRES_DB: maex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maex -d maex_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://maex:maex@localhost:5432/maex_test
      AGENT_API_TOKEN: ci-token
      ENV: test
      PYTEST_SHARD: ${{ strategy.job-index }}/${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every database here is thrown away after its test, so durability only costs
      # time. It saved 56 % locally (Docker Desktop) but about 5 % on the runner (#609).
      - name: Test database without durability
        run: >-
          docker exec ${{ job.services.db.id }} psql -U maex -d maex_test
          -c "ALTER SYSTEM SET fsync = off"
          -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off"
          -c "SELECT pg_reload_conf()"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r api/requirements.txt
      - run: pytest -q -n auto -m "not latency"

  # README structure (stdlib only, no path filter: it runs on every push and pull request,
  # so it never stays pending). Links, anchors, image safety and blocked terms fail the
  # job. Whether a generated image is stale is the advisory step in `checks`, not here.
  # Part of the required check `test` (Maxi, 2026-11-10, #622).
  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: README links, anchors, images and blocked terms
        # The secret holds one term per line; without it (a fork, Dependabot) the scan
        # says so and passes.
        env:
          README_BLOCKLIST: ${{ secrets.README_BLOCKLIST }}
        run: python scripts/readme_check.py

  # The browser code written in TypeScript (docs/22, #553): it passes the type check,
  # and the JavaScript committed in api/gui/static/ is exactly what the sources compile
  # to, so a hand edit of the output or a forgotten build fails here. The server image
  # carries no Node; this job is the only place the compiler runs outside a developer's
  # machine. Part of the required check `test`.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      # --intent-to-add: an output file that was never committed shows up in the diff too.
      - run: git add --intent-to-add api/gui/static
      - name: Compiled JavaScript matches its TypeScript sources
        run: git diff --exit-code -- api/gui/static

  # The required check `test` (ruleset on main) stands for the checks and every shard.
  # `always()`: a job skipped after a failed or cancelled need would count as passed.
  test:
    if: ${{ always() }}
    needs: [changes, checks, pytest, readme, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            [ "$result" = success ] || { echo "::error::a job this check stands for ended $result"; exit 1; }
          done

  docker-smoke:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.image != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: API-Image ohne lokales Zertifikat bauen
        run: |
          test ! -e api/ca-bundle.crt
          docker build --tag maex-api:ci ./api
      - name: API ohne Bind-Mount starten
        run: |
          docker run --detach --name maex-api-smoke \
            --env ENV=test --env AGENT_API_TOKEN=ci-smoke-token \
            maex-api:ci
      - name: Health und Token-Auth prüfen
        run: |
          docker exec -i maex-api-smoke python - <<'PY'
          import json
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          base = "http://127.0.0.1:8000"

          def request(path, token=None):
              headers = {} if token is None else {"Authorization": f"Bearer {token}"}
              method = "GET" if path == "/health" else "POST"
              req = Request(base + path, headers=headers, method=method)
              try:
                  response = urlopen(req, timeout=2)
              except HTTPError as exc:
                  response = exc
              with response:
                  return response.status, json.load(response)

          # Uvicorn braucht nach dem Containerstart kurz Zeit zum Importieren.
          deadline = time.monotonic() + 60
          while True:
              try:
                  status, body = request("/health")
                  assert status == 200 and body == {"status": "ok", "env": "test"}, body
                  break
              except (URLError, TimeoutError):
                  if time.monotonic() >= deadline:
                      raise
                  time.sleep(1)

          for token in (None, "wrong-token"):
              status, body = request("/v1/tools/ping", token)
              assert status == 401, (status, body)
              assert body["ok"] is False, body

          status, body = request("/v1/tools/ping", "ci-smoke-token")
          assert status == 200 and body["ok"] is True, (status, body)
          assert body["data"]["pong"] is True, body
          print("Docker smoke: health, missing/wrong token, authenticated ping passed")
          PY
      - name: Container-Logs bei Fehler anzeigen
        if: failure()
        run: docker logs maex-api-smoke
      - name: Container entfernen
        if: always()
        run: docker rm --force maex-api-smoke || true

  # The image of `voice` with the speech engines (api/Dockerfile, target voice):
  # its pinned packages install, and an ear or mouth without its model files is
  # refused. The test job runs in the API's image, which has no engines.
  voice-image:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.image != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image of voice
        run: docker build --target voice --tag maex-voice:ci ./api
      # The import first: without the packages the test file would skip
      # itself and pass (Codex on PR #310).
      - name: Engines without their model files are refused
        run: |
          docker run --rm --network none -v "$PWD:/app" -w /app maex-voice:ci \
            sh -c 'python -c "import faster_whisper, piper" &&
              python -m pytest -q -p no:cacheprovider api/tests/test_telephony_engine_loading.py'
