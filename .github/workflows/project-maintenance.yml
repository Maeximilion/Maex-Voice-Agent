name: project-maintenance

# The board is maintained once a day, not on every commit. During work nobody
# touches it: the built-in Project workflows move the status on merge.
# What slips past them - closed, but not on Done - this run corrects
# afterwards; everything else it only reports. Rationale: docs/16_GITHUB_PROJECT.md
on:
  schedule:
    # 03:00 UTC, so 05:00 in summer and 04:00 in winter. The hour does not matter
    # as long as it is the same every day; cron has no time zones.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      archive:
        description: "Additionally archive Done entries after 14 days (hides them from the roadmap)"
        type: boolean
        default: false

# The PAT writes the board. The GITHUB_TOKEN writes only the decision issue -
# deliberately it and not the PAT: a mention from your own account does not notify.
permissions:
  contents: read
  issues: write
  # Assignee and label on pull requests; they go through the issue interface,
  # but GitHub additionally requires this permission for pull requests.
  pull-requests: write

concurrency:
  group: projektpflege
  cancel-in-progress: false

jobs:
  pflege:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # First, and without PROJECT_TOKEN: the images on main and the social preview
      # reach the decision issue even when the board steps below fail. It only
      # reports; the fix is a PR (docs/15_README_STRATEGY.md, "Keeping them current").
      - name: README images
        id: images
        # A crash here must not stop the board: decision_issue.py treats the missing
        # file as a partial run.
        continue-on-error: true
        # Only on main: a run started by hand on another branch would report that
        # branch's images as main's. Skipped, the decision step keeps the section.
        if: github.ref == 'refs/heads/main'
        run: python scripts/readme_assets.py findings "$RUNNER_TEMP/images.json"

      - name: Check access
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        run: |
          if [ -z "$PROJECT_TOKEN" ] || [ -z "$PROJECT_NUMBER" ]; then
            echo "::error::Secret PROJECT_TOKEN or variable PROJECT_NUMBER is missing. Setup: docs/16_GITHUB_PROJECT.md"
            exit 1
          fi

      - name: Correct and report
        # Explicitly bash: only then does GitHub set pipefail. Without it the
        # exit code of tee wins, and a failed run would show green in the history.
        shell: bash
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        run: |
          # The report lands in the job summary, not as a comment on every
          # entry. One place to look instead of noise on the board.
          python scripts/project_report.py --fix ${{ inputs.archive && '--archive' || '' }} \
            --findings-json "$RUNNER_TEMP/befunde.json" \
            | tee "$GITHUB_STEP_SUMMARY"

      - name: Maintain the decision issue
        # What the maintenance cannot decide itself lands in exactly one issue.
        # It mentions only on new points; once nothing is open, it closes itself.
        # Also after a failed board step: a missing findings file makes the run
        # partial, which keeps the board's sections and never closes the issue.
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/decision_issue.py "$RUNNER_TEMP/befunde.json"
          --also "README images=$RUNNER_TEMP/images.json"

      - name: Fill in assignee and label of pull requests
        # Last, so a failure here does not hold up the board and the decision issue.
        # Sets only what is missing: assignee = owner, label from the title.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/pr_metadata.py

      - name: Image check failed
        # continue-on-error turns a crash of the image check green; the run must
        # not, or the check could stop without anybody noticing (Codex on 2bff6f5).
        if: ${{ !cancelled() && steps.images.outcome == 'failure' }}
        run: |
          echo "::error::readme_assets.py findings failed; the decision issue kept its README images section"
          exit 1
