name: ai-pr-review

# LLM review of each pull request on a local llama-server, posted as a GitHub
# review with inline comments (P0 to P3). The model is the repository variable
# REVIEW_MODEL (MODEL_ALIAS from config.env of the local-llm-kit); the server is
# reached at ZAI_API_BASE (127.0.0.1:8080 inside the runner distro). Free, and
# only there while the PC runs.
#
# Self-hosted runner in a public repository (Maxi, 06.10.2026, accepted risk,
# AGENTS.md "CI and workflows"). What keeps pull request code off the runner:
# - Fork pull requests never start this job (`if` below). A fork that edits
#   this file to drop the condition still needs Maxi's approval of the run
#   (fork approval: all_external_contributors, keep it that way).
# - The job never checks out pull request code. It runs the review script of
#   the base commit; the diff of exactly base...head comes from the API and is
#   only data for the model.
# - The runner is its own WSL distro `gh-runner`: interop and Windows drives
#   off, user `ghrunner` without sudo, reaches only the LLM on 127.0.0.1:8080.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# A new push to the same pull request cancels the running review.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Same-repository branches only: fork code never reaches the runner, and
    # Dependabot pull requests get no secrets.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: [self-hosted, wsl-local]
    # A local model takes longer than ten minutes on a large diff.
    timeout-minutes: 20
    steps:
      - name: Check out the review script of the base commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Export the diff of base...head
        id: diff
        run: |
          if [ ! -f .github/scripts/ai_pr_review.py ]; then
            echo "::notice::The base commit has no review script yet; nothing to run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api -H "Accept: application/vnd.github.diff" \
            "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" > pr.diff
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Post the LLM review
        if: steps.diff.outputs.skip != 'true'
        run: python3 .github/scripts/ai_pr_review.py
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_API_BASE: ${{ vars.ZAI_API_BASE }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          REVIEW_DISABLE_THINKING: ${{ vars.REVIEW_DISABLE_THINKING }}
