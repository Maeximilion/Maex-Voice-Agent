name: ai-pr-review

# Automatische LLM-Analyse jedes PR: Diff an die Z.ai-GLM-API schicken und das
# Ergebnis als GitHub-Review mit Inline-Kommentaren (P0-P3) posten, wie im
# Codex-Review-Bot-Beispiel. Benoetigt das Secret ZAI_API_KEY
# (Schluessel anlegen: https://z.ai/manage-apikey/apikey-list).
# Modell ueber die Repository-Variable REVIEW_MODEL einstellbar (Default glm-4.6).
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# Neuer Push auf denselben PR bricht den laufenden Review ab.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Dependabot-PRs bekommen von GitHub keine Secrets zugewiesen.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: PR-Diff exportieren
        run: gh pr diff "$PR_NUMBER" > pr.diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - name: GLM-Review posten
        run: python .github/scripts/ai_pr_review.py
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_API_BASE: ${{ vars.ZAI_API_BASE }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
