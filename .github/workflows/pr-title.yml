name: pr-title

# The pull request title becomes the squash commit message on main, so it has to follow
# Conventional Commits (CLAUDE.md section 8). The same required check fails a pull request
# whose commits or description credit an AI author (#609); `labeled` and `unlabeled`
# rerun it for its escape label.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

# Opening a pull request and editing its text right away fires two events; only the
# newest run counts.
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            ci
            perf
            build
            revert
      # The merge commit of the pull request: its first parent is the base, its second
      # the pull request's head, so HEAD^1..HEAD^2 are the pull request's own commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No AI attribution in commits or description
        run: python3 scripts/attribution_check.py --event "$GITHUB_EVENT_PATH" HEAD^1..HEAD^2
