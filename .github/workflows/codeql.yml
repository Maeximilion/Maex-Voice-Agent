name: codeql

# A push to main authored by Dependabot (squash merge) runs with a read-only token and cannot
# upload results; merge those PRs with a merge commit (docs/13_DEPLOYMENT.md). If one slips
# through, the Monday schedule below (or workflow_dispatch on main) refreshes the main analysis.
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL ${{ vars.CODEQL_ADVANCED_SETUP == 'true' && 'scan' || 'validation' }} (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Dependabot and fork PRs use the pull_request event, without repository
      # secrets, dependency installation, or execution of the project's code.
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
          # Default setup rejects uploads from advanced workflows. Validate the
          # full analysis first; publish after the documented setup switch.
          upload: ${{ vars.CODEQL_ADVANCED_SETUP == 'true' && 'always' || 'never' }}
      - name: Explain staged rollout
        if: vars.CODEQL_ADVANCED_SETUP != 'true'
        run: |
          echo '## CodeQL validation only' >> "$GITHUB_STEP_SUMMARY"
          echo 'Full analysis ran; results are not published. Default setup remains the active protection until the switch in docs/13_DEPLOYMENT.md.' >> "$GITHUB_STEP_SUMMARY"
