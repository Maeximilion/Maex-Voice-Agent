# What the README lists under "What works" and "Not yet working"
# (scripts/readme_assets.py writes both lists between the readme:capabilities markers).
#
# One entry per capability, in the order the README lists them:
#   works      the sentence under "What works", present tense
#   tasks      the task IDs of docs/07_WORKPACKAGES.md that build it; the entry moves
#              to "What works" by itself once every one of them is done
#   missing    the sentence under "Not yet working" until then (default: works)
#   waits_for  something outside the task list (a capture, a decision, a setup step):
#              the entry stays under "Not yet working" until this line is removed
# An entry without tasks and without waits_for was built outside the task list.

