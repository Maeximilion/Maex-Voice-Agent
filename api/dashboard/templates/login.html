{# Operator sign-in: name, password and a second factor in one form (docs/23 §5).
   One sentence for every refusal, whatever was wrong. #}
{% extends "base.html" %}
{% block title %}Sign in{% endblock %}

{% block main %}
<form class="card zugang-form" method="post" action="/login">
  <h1>Operator sign-in</h1>
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label for="name">Name</label>
  <input id="name" name="name" autocomplete="username" autocapitalize="none" required autofocus>
  <label for="password">Password</label>
  <input type="password" id="password" name="password" autocomplete="current-password" required>
  <label for="code">Code from the authenticator app, or a recovery code</label>
  <input id="code" name="code" autocomplete="one-time-code" inputmode="text" required>
  {% if message %}<p class="badge danger" role="alert">{{ message }}</p>{% endif %}
  <button type="submit" class="primary">Sign in</button>
</form>
{% endblock %}
