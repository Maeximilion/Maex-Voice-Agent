# Tool configuration. No package build: the API runs from the repo (api/ as a package).
#
# A change to this file makes GitHub re-run its own pip graph job for the root
# ("pip in /", correlator dependabot-pip). That job also scans api/requirements*.txt
# and only refreshes when this file changes, so its snapshot can lag behind a pin:
# on 2026-10-27 it still listed filelock 4.1.2 and kept six Dependabot alerts open
# although main pinned 4.2.1. If alerts stay open after a fixing bump, touch this file.

[tool.ruff]
# Single source of truth for lint and format. Without it the rule set depends on
# the ruff version: 0.16 ships default rules that 0.7 does not know, and every
# version update in the CI turns red without a single line of code having changed.
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear: common pitfalls
    "BLE",  # blind except: only with a reason via noqa
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "SIM",  # simplify
    "DTZ",  # naive datetime - we store UTC (CLAUDE.md §8)
    "RUF",  # ruff's own rules
]
ignore = [
    # The formatter decides the line length; it does not wrap long spoken sentences.
    "E501",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI idiom: Depends() belongs in the default value, this is not a B008.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Header",
]

[tool.mypy]
# Tightened step by step (T-0.12, docs/22 "Type checking and browser interfaces").
# Plain `mypy` checks these paths, in CI and in `make lint`.
python_version = "3.12"
files = ["api", "sim", "scripts", "evals", "printbridge", "db"]
# No package build and not every folder has an __init__.py: module names come from
# the repository root, as they do at runtime.
explicit_package_bases = true
# Bodies of unannotated functions are checked too, everywhere except the baseline below.
check_untyped_defs = true

[[tool.mypy.overrides]]
# Optional packages of the speech spike (api/telephony/speech_bench.py). They are not
# in api/requirements.txt and so are missing in CI. Named one by one: a missing
# import anywhere else stays an error.
module = [
    "numpy",
    "numpy.*",
    "faster_whisper",
    "faster_whisper.*",
    "onnx_asr",
    "onnx_asr.*",
    "piper",
    "piper.*",
    "huggingface_hub",
    "huggingface_hub.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Baseline of T-0.12 (11.11.2026): the test modules that still fail
# check_untyped_defs, 544 errors in 75 of 223 files, mostly attribute access on an
