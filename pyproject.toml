# Werkzeug-Konfiguration. Kein Paket-Build: die API laeuft aus dem Repo (api/ als Paket).

[tool.ruff]
# Einzige Quelle der Wahrheit fuer Lint und Format. Ohne sie haengt die Regelmenge an
# der ruff-Version: 0.16 bringt Standardregeln mit, die 0.7 nicht kennt, und jedes
# Versions-Update der CI faellt rot aus, ohne dass sich eine Zeile Code geaendert hat.
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear: haeufige Fallen
    "BLE",  # blindes except: nur mit Begruendung per noqa
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "SIM",  # simplify
    "DTZ",  # naive datetime - wir speichern UTC (CLAUDE.md §8)
    "RUF",  # ruff-eigene Regeln
]
ignore = [
    # Die Zeilenlaenge bestimmt der Formatter; lange Vorlesesaetze bricht er nicht um.
    "E501",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI-Idiom: Depends() gehoert in den Default-Wert, das ist kein B008.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Header",
]

[tool.mypy]
# Non-strict (CLAUDE.md section 3): bodies of unannotated functions are not checked.
# Plain `mypy` checks these paths, in CI and in `make lint`.
python_version = "3.12"
files = ["api", "sim", "scripts", "evals", "printbridge", "db"]
# No package build and not every folder has an __init__.py: module names come from
# the repository root, as they do at runtime.
explicit_package_bases = true

[[tool.mypy.overrides]]
# Optional packages of the speech spike (api/telephony/speech_bench.py). They are not
# in api/requirements.txt and so are missing in CI. Named one by one: a missing
# import anywhere else stays an error.
module = [
    "numpy",
    "numpy.*",
    "faster_whisper",
    "faster_whisper.*",
    "onnx_asr",
    "onnx_asr.*",
    "piper",
    "piper.*",
    "huggingface_hub",
    "huggingface_hub.*",
]
ignore_missing_imports = true
