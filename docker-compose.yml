services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api
      - ./gui:/app/gui
      - ./prompts:/app/prompts
      - ./scripts:/app/scripts
      - ./evals:/app/evals
      - ./db:/app/db
      # Quellcode wie ./api: ohne dieses Verzeichnis koennen die sim-Tests `sim` nicht
      # importieren (4 Collection-Errors) und ruff sortiert sim-Importe als Fremdpaket
      # ein (falsche I001-Meldungen). make test und make lint wichen so von der CI ab.
      - ./sim:/app/sim
      # scripts/status_bump.py schreibt docs/01_STATUS.md, deshalb nicht read-only.
      - ./docs:/app/docs
      # Ohne diese Datei findet ruff im Container keine Konfiguration und prueft nach
      # seiner Standardmenge: make lint wuerde andere Regeln melden als die CI.
      - ./pyproject.toml:/app/pyproject.toml:ro
      # Die folgenden Pfade liest die Testsuite nur: test_commands.py prueft die
      # Slash-Befehle gegen Makefile, .claude/commands und die verwiesenen Dokumente,
      # test_gui_router.py prueft deploy/Caddyfile. Fehlen sie, faellt pytest mit
      # FileNotFoundError aus, obwohl der Code in Ordnung ist.
      - ./Makefile:/app/Makefile:ro
      - ./deploy:/app/deploy:ro
      # Nur commands/, nicht ganz .claude/: dort liegen im Haupt-Checkout die
      # Worktrees mit ihren eigenen .env-Dateien, die im Container nichts zu
      # suchen haben (CLAUDE.md §8). Der Test liest ohnehin nur die Befehle.
      - ./.claude/commands:/app/.claude/commands:ro
      - ./CLAUDE.md:/app/CLAUDE.md:ro
      - ./README.md:/app/README.md:ro
      - ./CHANGELOG.md:/app/CHANGELOG.md:ro
      # api/tests/test_compose_mounts.py prueft diese Liste gegen das, was die
      # Suite tatsaechlich liest, und braucht die Datei dafuer im Container.
      - ./docker-compose.yml:/app/docker-compose.yml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  dispatcher:
    # Eigener Prozess, damit der heiße Pfad nie auf n8n wartet (docs/11 §events).
    build: ./api
    restart: unless-stopped
    env_file: .env
    command: python -m api.events.dispatcher
    depends_on:
      db:
        condition: service_healthy
    # Hier laufen weder pytest noch ruff: der Prozess braucht nur api, scripts und db.
    volumes:
      - ./api:/app/api
      - ./scripts:/app/scripts
      - ./db:/app/db

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      GENERIC_TIMEZONE: Europe/Berlin
      # n8n lauscht standardmäßig auf "::" und stirbt auf Docker-Hosts ohne IPv6
      N8N_LISTEN_ADDRESS: 0.0.0.0
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n:/workflows
    ports:
      - "5678:5678"

volumes:
  pgdata:
  n8ndata:
