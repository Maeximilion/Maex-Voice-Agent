# Base file, shared by development and production. No service publishes a host
# port here: Compose merges `ports` lists across files, so an override cannot
# take one away again with `ports: []`. Dev ports live in
# docker-compose.override.yml (loopback only), the public ones in
# deploy/docker-compose.prod.yml (caddy only). api/tests/test_compose_ports.py
# checks both.

# Every service (#252 finding 8): no process gains rights after the start
# (setuid binaries, file capabilities), and no kernel capability is kept that
# the service does not need. A service that needs one adds it with `cap_add`.
x-hardened: &hardened
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

# What the own code reads (api/config.py), handed by name instead of all of
# .env (#252 finding 7): a key without a value takes the line of .env, and with
# no such line it stays unset, so the default of api/config.py applies. The
# owner of the schema, Asterisk, Caddy, n8n and the push server have secrets in
# .env that none of api, dispatcher and voice gets. Each of the three adds the
# secrets it reads below; api/tests/test_deploy_exposure.py checks the lists
# against api/config.py.
x-settings: &settings
  ENV:
  LOG_LEVEL:
  # Secrets all three need: the database, and the token, which the start check
  # of api/config.py asks of every process outside dev and test, also of one
  # that serves no route behind it (dispatcher, voice).
  DATABASE_URL:
  AGENT_API_TOKEN:
  TENANT_NAME:
  TENANT_TIMEZONE:
  TEAM_PHONE:
  MAX_CALL_SECONDS:
  PRIVACY_NOTICE_ADDRESS:
  N8N_WEBHOOK_URL:
  N8N_BASIC_AUTH_USER:
  N8N_TIMEOUT_SECONDS:
  DISPATCHER_INTERVAL_SECONDS:
  DISPATCHER_BATCH:
  KITCHEN_BRIDGE_TENANT_ID:
  LLM_BASE_URL:
  LLM_MODEL:
  LLM_TIMEOUT_SECONDS:
  LLM_MAX_OUTPUT_TOKENS:
  LLM_REASONING_EFFORT:
  LLM_INPUT_CENTS_PER_MTOK:
  LLM_OUTPUT_CENTS_PER_MTOK:
  VOICE_NUMBER:
  VOICE_SILENCE_SECONDS:
  VOICE_EAR_CENTS_PER_HOUR:
  VOICE_MOUTH_CENTS_PER_MCHAR:
  VOICE_OUTBOUND_CENTS_PER_HOUR:
  VOICE_EAR:
  VOICE_MOUTH:
  VOICE_EAR_DEVICE:
  VOICE_MOUTH_VOICE:
  MENU_FUZZY_THRESHOLD_HIGH:
  MENU_FUZZY_THRESHOLD_LOW:
  CALL_LOG_RETENTION_DAYS:
  RETENTION_CALLER_ID_DAYS:
  RETENTION_GUEST_DETAILS_DAYS:
  RETENTION_CALLBACK_DAYS:
  RETENTION_OUTBOX_SENT_DAYS:
  RETENTION_OUTBOX_UNSENT_DAYS:
  RETENTION_OUTBOX_ROW_DAYS:
  RETENTION_AUDIT_LOG_DAYS:
  RETENTION_ALLERGY_NOTE_DAYS:
  RETENTION_CONSENT_LOG_YEARS:
  RETENTION_INTERVAL_SECONDS:
  REGISTER_REPORT_HOUR:
  MONITOR_PUSH_URL:
  ALARM_COST_PER_DAY_CENTS:
  ALARM_ERROR_CALLS_PER_HOUR:
  MONITOR_REPORT_HOUR:
  VOICE_URL:
  ALARM_BRIDGE_SILENT_MINUTES:
  ALARM_BACKUP_HOURS:

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    <<: *hardened
    # The image's entrypoint starts as root, makes the data directory the
    # postgres user's and drops to it.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    # Writes into its volume, its socket and lock file into /var/run/postgresql.
    read_only: true
    tmpfs: [/var/run/postgresql, /tmp]
    # No DETAIL in the server's log: a constraint error writes the failing
    # row there, guest name and phone included (repo audit of 27.10.2026).
    command: ["postgres", "-c", "log_error_verbosity=terse"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    # Capabilities stay: in development it runs as root and writes into the
    # mounted checkout (status_bump.py, eval reports), which on a Linux host
    # belongs to another user and needs DAC_OVERRIDE. The production file
    # drops them all, with a user of its own and a read-only root.
    security_opt: ["no-new-privileges:true"]
    # Not the owner of the schema: where the application has a database role
    # of its own (docs/13 §3), a process that reads its environment must not
    # find the superuser's password there. scripts/migrate.sh hands the
    # owner's URL to Alembic in a container of its own.
    environment:
      <<: *settings
      # Checked here, sent by Caddy (deploy/Caddyfile).
      GUI_PROXY_SECRET:
      KITCHEN_BRIDGE_TOKEN:
      # For the eval runner and the text phone in this container (`make
      # eval`); the production file blanks it, the server's API calls no model.
      LLM_API_KEY:
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app/api
      - ./gui:/app/gui
      - ./prompts:/app/prompts
      - ./scripts:/app/scripts
      - ./evals:/app/evals
      - ./db:/app/db
      # Quellcode wie ./api: ohne dieses Verzeichnis koennen die sim-Tests `sim` nicht
      # importieren (4 Collection-Errors) und ruff sortiert sim-Importe als Fremdpaket
      # ein (falsche I001-Meldungen). make test und make lint wichen so von der CI ab.
      - ./sim:/app/sim
      # Druckbruecke (T-4.6): laeuft im Lokal, ihre Tests laufen hier mit.
      - ./printbridge:/app/printbridge
      # scripts/status_bump.py schreibt docs/01_STATUS.md, deshalb nicht read-only.
      - ./docs:/app/docs
      # Ohne diese Datei findet ruff im Container keine Konfiguration und prueft nach
      # seiner Standardmenge: make lint wuerde andere Regeln melden als die CI.
      - ./pyproject.toml:/app/pyproject.toml:ro
      # Die folgenden Pfade liest die Testsuite nur: test_commands.py prueft die
      # Slash-Befehle gegen Makefile, .claude/commands und die verwiesenen Dokumente,
      # test_gui_router.py prueft deploy/Caddyfile. Fehlen sie, faellt pytest mit
      # FileNotFoundError aus, obwohl der Code in Ordnung ist.
      - ./Makefile:/app/Makefile:ro
      - ./deploy:/app/deploy:ro
      # Nur commands/, nicht ganz .claude/: dort liegen im Haupt-Checkout die
      # Worktrees mit ihren eigenen .env-Dateien, die im Container nichts zu
      # suchen haben (CLAUDE.md §8). Der Test liest ohnehin nur die Befehle.
      - ./.claude/commands:/app/.claude/commands:ro
      - ./CLAUDE.md:/app/CLAUDE.md:ro
      - ./README.md:/app/README.md:ro
      - ./CHANGELOG.md:/app/CHANGELOG.md:ro
      # test_n8n_workflow.py checks the workflow export against api/events/types.py.
      - ./n8n:/app/n8n:ro
      # test_push_service.py checks that the example holds no credentials. Only
      # the example: .env itself never goes into a container.
      - ./.env.example:/app/.env.example:ro
      # api/tests/test_compose_mounts.py prueft diese Liste gegen das, was die
      # Suite tatsaechlich liest, und braucht die Datei dafuer im Container.
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      # api/tests/test_compose_ports.py reads the dev ports from this file.
      - ./docker-compose.override.yml:/app/docker-compose.override.yml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  dispatcher:
    # Eigener Prozess, damit der heiße Pfad nie auf n8n wartet (docs/11 §events).
    build: ./api
    restart: unless-stopped
    <<: *hardened
    # It writes nothing: its mounts and the image stay as they are.
    read_only: true
    tmpfs: [/tmp]
    environment:
      <<: *settings
      # The credential of the webhook node it sends (n8n/README.md).
      N8N_BASIC_AUTH_PASSWORD:
      # Its own token at the push server for the operator's alarms (T-8.3).
      MONITOR_PUSH_TOKEN:
    command: python -m api.jobs.cold_path
    depends_on:
      db:
        condition: service_healthy
    # Hier laufen weder pytest noch ruff: der Prozess braucht nur api, scripts und db.
    volumes:
      - ./api:/app/api
      - ./scripts:/app/scripts
      - ./db:/app/db

  # The own voice layer (docs/20 §2): the AI telephone. Started only with the
  # profile `voice` (`docker compose --profile voice up -d`, or
  # COMPOSE_PROFILES=voice in .env), never by a plain `up`: without a telephone
  # access in .env there is nothing for it to answer.
  voice:
    profiles: ["voice"]
    # The API's image plus the speech engines (api/Dockerfile, target voice).
    build:
      context: ./api
      target: voice
    restart: unless-stopped
    environment:
      <<: *settings
      # The core of a call asks the model.
      LLM_API_KEY:
      # Its own secret, shared with Asterisk only.
      VOICE_MEDIA_TOKEN: ${VOICE_MEDIA_TOKEN:-}
    # Not root, from the start (docs/01 open points): it reads its mounts and
    # writes nothing there but the sentences into /announcements.
    user: "10001:10001"
    <<: *hardened
    read_only: true
    tmpfs: [/tmp]
    # One worker: the live calls are held in this process (api/telephony/app.py).
    command:
      - uvicorn
      - --factory
      - api.telephony.app:from_settings
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    depends_on:
      db:
        condition: service_healthy
    # The core of a call reads its prompt from prompts/, the engines their
    # model files from /models: those the speech kit downloads (docs/20 §10).
    # A worktree hard-links them from the main checkout:
    # mkdir -p deploy/speech/run && cp -al ~/Maex-Voice-Agent/deploy/speech/run/models deploy/speech/run/
    volumes:
      - ./api:/app/api
      - ./prompts:/app/prompts
      - ./deploy/speech/run/models:/models:ro
      - announcements:/announcements
    # Whisper on the graphics card (VOICE_EAR_DEVICE=cuda, the workbench's).
    # ponytail: asked for on every host that runs the profile; one without a
    # graphics card needs `deploy: !reset {}` in its own Compose file.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      # Loading the engines takes its time; until then nothing listens.
      start_period: 120s

  asterisk:
    profiles: ["voice"]
    # Asterisk 22.11.0 with chan_websocket. Pinned by digest, a third-party
    # build. Not older: before 22.11.0 a `voice` that takes the connection and
    # answers nothing held the call for ever, and the team never rang (Asterisk
    # issue #1979, the drill "voice frozen").
    image: andrius/asterisk:22.11.0_alpine-3.24-537e52c@sha256:98c0e598fb16492215ddc7cc52c3200646b44584ffa9267bebecff531fd3530b
    restart: unless-stopped
    # Renders deploy/asterisk/conf/ into the tmpfs below, then starts as the
    # image does, without its -vvvddd: verbose output prints every dialplan
    # step with its values, the media token included.
    entrypoint: ["/bin/sh", "/templates/render.sh"]
    command: ["/usr/sbin/asterisk", "-f", "-T", "-W", "-U", "asterisk", "-p"]
    # render.sh and the image's entrypoint run as root: they write the
    # configuration and make the runtime directories the asterisk user's,
    # then Asterisk drops to that user itself. Not read-only: it writes into
    # /var/lib, /var/spool and /var/log of the image, next to what it ships there.
    <<: *hardened
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    # Only what the AI telephone needs, not the whole .env: no database or
    # model credentials in this container.
    environment:
      ASTERISK_TERMINAL_OPTS: "-n"
      VOICE_NUMBER: ${VOICE_NUMBER:-}
      VOICE_MEDIA_TOKEN: ${VOICE_MEDIA_TOKEN:-}
      TEAM_PHONE: ${TEAM_PHONE:-}
      TRANSFER_TARGETS: ${TRANSFER_TARGETS:-}
      ACCESS_HOST: ${ACCESS_HOST:-}
      # Other addresses the access sends from (deploy/asterisk/render.sh), may be empty.
      ACCESS_ALSO: ${ACCESS_ALSO:-}
      ACCESS_USER: ${ACCESS_USER:-}
      ACCESS_PASSWORD: ${ACCESS_PASSWORD:-}
    tmpfs:
      - /etc/asterisk
    volumes:
      - ./deploy/asterisk/conf:/templates/conf:ro
      - ./deploy/asterisk/render.sh:/templates/render.sh:ro
      - announcements:/announcements:ro
    # Healthy only while registered at the access: booted but not registered,
    # no call reaches the AI telephone, and `docker compose ps` should say so
    # (Codex on PR #297). While registered it tells `voice`, for the monitor
    # (T-8.3): it takes no connection of its own to be asked on. A `voice` that
    # is down does not make Asterisk unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'pjsip show registrations' | grep -q ' Registered ' && { curl -fsS -m 2 -o /dev/null -X POST -u \"asterisk:$$VOICE_MEDIA_TOKEN\" http://voice:8001/asterisk/alive || true; }"]
      interval: 10s
      timeout: 5s
      retries: 6

  n8n:
    # Pinned on purpose: a floating tag can change n8n behaviour (and migrate its database)
    # without anyone noticing. Dependabot proposes updates as pull requests.
    # 2.41.4 or newer is required: GHSA-3qcw-p65v-c7vq (unauthenticated, unbounded growth of
    # the database through the authorize endpoint) affects every older release.
    image: n8nio/n8n:2.44.3
    restart: unless-stopped
    environment:
      # No usage data to n8n (#252 finding 9).
      N8N_DIAGNOSTICS_ENABLED: "false"
      # Optional, from .env: the key n8n encrypts the stored credentials with.
      # Unset, n8n uses the one it wrote into the volume (/home/node/.n8n/config)
      # at its first start. Set, it must be that very key, or n8n refuses to
      # start: copy it from the volume, never a new one (docs/13 §3).
      N8N_ENCRYPTION_KEY:
      # No N8N_BASIC_AUTH_* here: n8n dropped that login with version 1 and
      # ignores the variables. The editor is protected by its own owner account
      # and, in production, by the access in deploy/Caddyfile. The two values in
      # .env are the credential of the webhook node (n8n/README.md), which the
      # dispatcher sends; n8n itself never reads them from the environment.
      GENERIC_TIMEZONE: Europe/Berlin
      # n8n lauscht standardmäßig auf "::" und stirbt auf Docker-Hosts ohne IPv6
      N8N_LISTEN_ADDRESS: 0.0.0.0
      # An execution holds the event it carried, which can name a guest:
      # kept 168 hours, n8n's own default would be 336 (T-11.7,
      # docs/03 "Löschkonzept"; names checked in n8n 2.44.3).
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n:/workflows
    <<: *hardened
    # It writes its database and key into the volume and its compiled
    # assets into ~/.cache, which it creates at every start.
    read_only: true
    tmpfs: [/tmp, /home/node/.cache]

  push:
    # Push server for team notifications (D13, n8n/README.md): the n8n workflow
    # publishes, the team's devices subscribe. Nothing is forwarded to an
    # upstream relay, the messages stay on this server.
    image: binwiederhier/ntfy:v2.31.1
    restart: unless-stopped
    # The server refuses to start with an empty user list, and with access
    # rules for users it does not know. So the rules are set only when users
    # exist; without users it starts closed for everyone instead of not at all.
    # n8n may only write to the topic, the team may only read it. The topic
    # `ops` of the operator's alarms (T-8.3) is opened only when both of its
    # users exist, so a stack without them still starts.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -n "$$NTFY_AUTH_USERS" ]; then
          export NTFY_AUTH_ACCESS="n8n:team:wo,team:team:ro"
          case ",$$NTFY_AUTH_USERS" in *,monitor:*)
            case ",$$NTFY_AUTH_USERS" in *,ops:*)
              export NTFY_AUTH_ACCESS="$$NTFY_AUTH_ACCESS,monitor:ops:wo,ops:ops:ro";;
            esac;;
          esac
        else
          unset NTFY_AUTH_USERS NTFY_AUTH_TOKENS
        fi
        exec ntfy serve
    environment:
      - NTFY_CACHE_FILE=/var/lib/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/lib/ntfy/auth.db
      # Closed unless a rule opens it.
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_ENABLE_LOGIN=true
      # Keys without a value come from .env (.env.example).
      - NTFY_BASE_URL
      - NTFY_AUTH_USERS
      - NTFY_AUTH_TOKENS
    volumes:
      - pushdata:/var/lib/ntfy
    # Root in the image, but it only listens and writes into its volume.
    <<: *hardened
    read_only: true
    tmpfs: [/tmp]

volumes:
  pgdata:
  n8ndata:
  pushdata:
  # The sentences after a team leg nobody answered (T-10.8): `voice` renders
  # them at its start, Asterisk plays them, also while `voice` is down
  # (api/telephony/app.py `announce`). Nothing secret in them; in memory, kept
  # while either of the two runs, and rendered again at every start.
  announcements:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=4m,uid=10001,gid=10001,mode=0755"
