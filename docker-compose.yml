services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api
      - ./gui:/app/gui
      - ./prompts:/app/prompts
      - ./scripts:/app/scripts
      - ./evals:/app/evals
      - ./db:/app/db
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  dispatcher:
    # Eigener Prozess, damit der heiße Pfad nie auf n8n wartet (docs/11 §events).
    build: ./api
    restart: unless-stopped
    env_file: .env
    command: python -m api.events.dispatcher
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app/api
      - ./scripts:/app/scripts
      - ./db:/app/db

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      GENERIC_TIMEZONE: Europe/Berlin
      # n8n lauscht standardmäßig auf "::" und stirbt auf Docker-Hosts ohne IPv6
      N8N_LISTEN_ADDRESS: 0.0.0.0
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n:/workflows
    ports:
      - "5678:5678"

volumes:
  pgdata:
  n8ndata:
